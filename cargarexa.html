<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Gestión y Carga de Exámenes</title>
<meta name="viewport" content="width=device-width, initial-scale=1">

<style>
*{box-sizing:border-box; user-select:none;}

body{
  margin:0;
  font-family:'Segoe UI',sans-serif;
  background:linear-gradient(to bottom right,#cceeff,#99ccff);
  padding:12px;
  color:#003b57;
  min-height:100vh;
}

.wrap{
  max-width:1450px;
  margin:0 auto;
  background:#fff;
  border-radius:18px;
  box-shadow:0 0 12px rgba(0,0,0,.12);
  overflow:hidden;
}

.top{
  padding:14px 16px;
  border-bottom:3px solid #0099cc;
}

.encabezado{
  display:flex;
  align-items:center;
  justify-content:center;
  gap:12px;
  margin-bottom:12px;
}

.title{
  font-size:22px;
  font-weight:800;
  color:#004466;
}

.controls{
  display:flex;
  gap:10px;
  align-items:center;
  flex-wrap:wrap;
  justify-content:center;
}

select,input{
  padding:8px;
  border-radius:8px;
  border:1px solid #9ed8ef;
  font-size:14px;
}

.btn{
  border:none;
  background:#0099cc;
  color:white;
  padding:8px 14px;
  border-radius:9px;
  cursor:pointer;
  font-weight:700;
}

.btn:hover{background:#007faa}
.btn-green{background:#00a86b}
.btn-green:hover{background:#008e5b}
.btn-red{background:#d9534f}
.btn-red:hover{background:#c9302c}
.btn-purple{background:#8e44ad}
.btn-purple:hover{background:#732d91}
.btn-guardar{background:#2980b9}
.btn-guardar:hover{background:#1f618d}

/* VISTA CALENDARIO POR FECHA */
.vista-fecha-container{
  padding: 20px;
}

.calendario-grid{
  display: flex;
  gap: 20px;
  flex-wrap: wrap;
  align-items: flex-start;
}

.selector-fechas-box{
  flex: 1;
  min-width: 280px;
  background: #f4fbff;
  border: 2px solid #bce2f3;
  border-radius: 12px;
  padding: 16px;
  max-height: 500px;
  overflow-y: auto;
}

.fecha-item-btn{
  width: 100%;
  padding: 10px 14px;
  margin-bottom: 8px;
  background: #ffffff;
  border: 1px solid #9ed8ef;
  border-radius: 8px;
  text-align: left;
  font-weight: 700;
  color: #004466;
  cursor: pointer;
  display: flex;
  justify-content: space-between;
  align-items: center;
  transition: all 0.2s ease;
}

.fecha-item-btn:hover{
  background: #e1f3fc;
  border-color: #0099cc;
}

.fecha-item-btn.active{
  background: #0099cc;
  color: white;
  border-color: #007faa;
}

.badge-contador{
  background: #d63384;
  color: white;
  padding: 2px 8px;
  border-radius: 12px;
  font-size: 11px;
}

.fecha-item-btn.active .badge-contador{
  background: #ffffff;
  color: #0099cc;
}

.detalle-fecha-box{
  flex: 2.5;
  min-width: 320px;
  background: #ffffff;
  border: 2px solid #bce2f3;
  border-radius: 12px;
  padding: 16px;
}

/* TABLA EXÁMENES */
.seccion-tabla{
  padding:16px;
  overflow-x:auto;
}

.subtitulo-header{
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 12px;
  flex-wrap: wrap;
  gap: 10px;
}

.subtitulo{
  font-size:18px;
  color:#005b84;
  border-left:5px solid #1aa7d6;
  padding-left:10px;
  font-weight:700;
  text-transform:uppercase;
  margin: 0;
}

table.tabla-examenes{
  width:100%;
  border-collapse:collapse;
  border-radius:10px;
  overflow:hidden;
  background:#ffffff;
}

table.tabla-examenes th, 
table.tabla-examenes td{
  border:1px solid #1aa7d6;
  padding:8px 6px;
  text-align:center;
  vertical-align:middle;
  font-size:12px;
}

table.tabla-examenes thead{
  background:#bfe8fb;
}

table.tabla-examenes th{
  color:#003f5c;
  font-weight:700;
  text-transform:uppercase;
}

.checkbox-col{
  width: 45px;
}

.checkbox-periodo{
  width: 20px;
  height: 20px;
  cursor: pointer;
  accent-color: #0099cc;
}

.input-tabla{
  width: 100%;
  padding: 4px;
  font-size: 11px;
  border: 1px solid #bce2f3;
  border-radius: 4px;
  text-align: center;
  background: #fcfefe;
}

.input-tabla:focus{
  background: #fff;
  border-color: #0099cc;
  outline: none;
}

.acciones-item{
  display: flex;
  gap: 4px;
  justify-content: center;
}

.btn-mini{
  font-size: 10px;
  padding: 3px 6px;
  border-radius: 4px;
  border: none;
  cursor: pointer;
  color: white;
}

.mensaje-info{
  text-align:center;
  padding:30px;
  color:#005b84;
  font-weight:600;
  font-size:15px;
}

@media(max-width:700px){
  body{padding:6px}
  .controls{flex-direction:column; align-items:stretch;}
  .subtitulo-header{flex-direction: column; align-items: stretch;}
  .calendario-grid{flex-direction: column;}
}
</style>
</head>

<body>

<div class="wrap">

  <div class="top">
    <div class="encabezado">
      <div class="title">Gestión y Carga de Exámenes Institucionales</div>
    </div>

    <div class="controls">
      <label>Especialidad:</label>
      <select id="filtroEspecialidad" onchange="filtrarYRenderizar()">
        <option value="">-- Todas las Especialidades --</option>
      </select>

      <label>Nivel / Año:</label>
      <select id="filtroNivel" onchange="filtrarYRenderizar()">
        <option value="">-- Todos los Niveles --</option>
      </select>

      <label>Plan:</label>
      <select id="filtroPlan" onchange="filtrarYRenderizar()">
        <option value="">-- Todos los Planes --</option>
      </select>

      <button class="btn btn-purple" onclick="alternarVistaFecha()">📅 Ver por Fecha (Hoy)</button>
      <button class="btn btn-guardar" onclick="guardarEnFirebase()">💾 Guardar en la Nube</button>
      <button class="btn btn-green" onclick="descargarJSONExamenes()">📥 Descargar JSON</button>
    </div>
  </div>

  <!-- VISTA GENERAL (TABLA EDITABLE) -->
  <div id="seccionTablaGeneral" class="seccion-tabla">
    <div class="subtitulo-header">
      <div class="subtitulo" id="tituloTabla">LISTADO GENERAL DE EXÁMENES</div>
      <button class="btn btn-green" onclick="agregarFilaExamen()">➕ Agregar Examen</button>
    </div>

    <div id="mensajeInfo" class="mensaje-info" style="display:none;">No se encontraron exámenes con los filtros seleccionados.</div>

    <table id="tablaExamenes" class="tabla-examenes">
      <thead>
        <tr>
          <th class="checkbox-col" title="Seleccionar si se da en el período">Período</th>
          <th>Fecha</th>
          <th>Hora</th>
          <th>Plan</th>
          <th>Nivel</th>
          <th>D.A</th>
          <th>Especialidad</th>
          <th>Asignatura / U. Curricular</th>
          <th>Presidente</th>
          <th>Secretario</th>
          <th>Vocal</th>
          <th>Suplente</th>
          <th>Acciones</th>
        </tr>
      </thead>
      <tbody id="cuerpoTablaExamenes"></tbody>
    </table>
  </div>

  <!-- VISTA CALENDARIO / POR FECHA -->
  <div id="seccionVistaFecha" class="vista-fecha-container" style="display:none;">
    <div class="subtitulo-header">
      <div class="subtitulo" id="tituloVistaFecha">EXÁMENES AGRUPADOS POR FECHA</div>
      <button class="btn" onclick="alternarVistaFecha()">⬅️ Volver al Listado General</button>
    </div>

    <div class="calendario-grid">
      <div class="selector-fechas-box" id="listaFechasLateral"></div>
      <div class="detalle-fecha-box">
        <div class="subtitulo" id="tituloDetalleFecha" style="margin-bottom: 12px; font-size:16px;">Seleccione una fecha</div>
        <div id="contenidoDetalleFecha"></div>
      </div>
    </div>
  </div>

</div>

<!-- FIREBASE UTILS -->
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>

<script>
const firebaseConfig = {
  apiKey: "AIzaSyAUbSmA64Kj6326H8-FJqSFDyb1Zzardj8",
  authDomain: "calendario-actividades-76382.firebaseapp.com",
  databaseURL: "https://calendario-actividades-76382-default-rtdb.firebaseio.com",
  projectId: "calendario-actividades-76382",
  storageBucket: "calendario-actividades-76382.firebasestorage.app",
  messagingSenderId: "455833092742",
  appId: "1:455833092742:web:eafb4950d8de8409b80707",
  measurementId: "G-YWQ92KPD0T"
};

firebase.initializeApp(firebaseConfig);
const database = firebase.database();

const listaEspecialidadesBase = [
  "Biología", "Com. Visual", "Derecho", "Español",
  "Física", "Geografía", "Historia", "Informática",
  "Inglés", "Literatura", "Matemática", "Química",
  "Trayecto equivalente", "Maestro Técnico", "Filosofía",
  "Sociología"
];

let examenesData = [];
let vistaCalendarioActiva = false;
let fechaSeleccionadaActual = null;

function normalizarTexto(texto) {
  return String(texto || "")
    .normalize("NFD")
    .replace(/[\u0300-\u036f]/g, "")
    .toLowerCase()
    .trim();
}

// Función auxiliar para obtener la asignatura independientemente de cómo venga escrita en la propiedad
function obtenerAsignatura(item) {
  return item["Unidad Curricular/Asignatura"] || item["Asignatura"] || item["Unidad Curricular"] || "";
}

function actualizarListasFiltros() {
  const selectEsp = document.getElementById("filtroEspecialidad");
  const selectNivel = document.getElementById("filtroNivel");
  const selectPlan = document.getElementById("filtroPlan");

  const valEspActual = selectEsp.value;
  const valNivelActual = selectNivel.value;
  const valPlanActual = selectPlan.value;

  // Extraer valores únicos existentes en los datos para asegurar que funcionen los filtros
  const especialidadesSet = new Set(listaEspecialidadesBase);
  const nivelesSet = new Set();
  const planesSet = new Set();

  examenesData.forEach(item => {
    if(item.Especialidad) especialidadesSet.add(item.Especialidad.trim());
    if(item.Nivel) nivelesSet.add(String(item.Nivel).trim());
    if(item.Plan) planesSet.add(String(item.Plan).trim());
  });

  // Poblar Especialidad
  selectEsp.innerHTML = '<option value="">-- Todas las Especialidades --</option>';
  Array.from(especialidadesSet).sort().forEach(esp => {
    const op = document.createElement("option");
    op.value = esp;
    op.textContent = esp;
    if(esp === valEspActual) op.selected = true;
    selectEsp.appendChild(op);
  });

  // Poblar Nivel
  selectNivel.innerHTML = '<option value="">-- Todos los Niveles --</option>';
  Array.from(nivelesSet).sort().forEach(niv => {
    const op = document.createElement("option");
    op.value = niv;
    op.textContent = niv;
    if(niv === valNivelActual) op.selected = true;
    selectNivel.appendChild(op);
  });

  // Poblar Plan
  selectPlan.innerHTML = '<option value="">-- Todos los Planes --</option>';
  Array.from(planesSet).sort().forEach(pln => {
    const op = document.createElement("option");
    op.value = pln;
    op.textContent = pln;
    if(pln === valPlanActual) op.selected = true;
    selectPlan.appendChild(op);
  });
}

// Sincronización en tiempo real con Firebase
database.ref("gestion_examenes").on("value", function(snapshot){
  const data = snapshot.val();
  if(data && Array.isArray(data)){
    examenesData = data.map(item => ({
      ...item,
      activo: item.activo !== undefined ? item.activo : true 
    }));
    actualizarListasFiltros();
    filtrarYRenderizar();
  } else {
    fetch("https://cerpsalto.github.io/examenes/examenes.json")
      .then(res => res.json())
      .then(jsonRemoto => {
        examenesData = jsonRemoto.map(item => ({
          ...item,
          activo: item.activo !== undefined ? item.activo : true 
        }));
        actualizarListasFiltros();
        filtrarYRenderizar();
      })
      .catch(() => { examenesData = []; actualizarListasFiltros(); filtrarYRenderizar(); });
  }
  if(vistaCalendarioActiva) poblarVistaFechas();
});

actualizarListasFiltros();

function filtrarYRenderizar(){
  const espSel = normalizarTexto(document.getElementById("filtroEspecialidad").value);
  const nivelSel = normalizarTexto(document.getElementById("filtroNivel").value);
  const planSel = document.getElementById("filtroPlan").value;

  const tbody = document.getElementById("cuerpoTablaExamenes");
  const mensaje = document.getElementById("mensajeInfo");
  const tabla = document.getElementById("tablaExamenes");

  const filtrados = examenesData.filter((item, index) => {
    item._indexReal = index; 

    const itemEsp = normalizarTexto(item.Especialidad);
    const itemNivel = normalizarTexto(item.Nivel);
    const itemPlan = String(item.Plan || "").trim();

    const matchEsp = !espSel || itemEsp === espSel || itemEsp.includes(espSel);
    const matchNivel = !nivelSel || itemNivel === nivelSel;
    const matchPlan = !planSel || itemPlan === planSel;

    return matchEsp && matchNivel && matchPlan;
  });

  if(filtrados.length === 0){
    tabla.style.display = "none";
    mensaje.style.display = "block";
    return;
  }

  let html = "";
  filtrados.forEach((item) => {
    const i = item._indexReal;
    const nombreAsignatura = obtenerAsignatura(item);

    html += `
      <tr>
        <td class="checkbox-col">
          <input type="checkbox" class="checkbox-periodo" ${item.activo ? "checked" : ""} onchange="actualizarActivo(${i}, this.checked)">
        </td>
        <td><input type="text" class="input-tabla" value="${escapeHtml(item.Fecha || '')}" onchange="actualizarCampo(${i}, 'Fecha', this.value)"></td>
        <td><input type="text" class="input-tabla" style="width:70px;" value="${escapeHtml(item.Hora || '')}" onchange="actualizarCampo(${i}, 'Hora', this.value)"></td>
        <td><input type="text" class="input-tabla" style="width:60px;" value="${escapeHtml(item.Plan || '')}" onchange="actualizarCampo(${i}, 'Plan', this.value)"></td>
        <td><input type="text" class="input-tabla" style="width:50px;" value="${escapeHtml(item.Nivel || '')}" onchange="actualizarCampo(${i}, 'Nivel', this.value)"></td>
        <td><input type="text" class="input-tabla" style="width:80px;" value="${escapeHtml(item["D.A"] || '')}" onchange="actualizarCampo(${i}, 'D.A', this.value)"></td>
        <td>
          <select class="input-tabla" onchange="actualizarCampo(${i}, 'Especialidad', this.value)">
            ${listaEspecialidadesBase.map(esp => `<option value="${esp}" ${normalizarTexto(item.Especialidad) === normalizarTexto(esp) ? 'selected' : ''}>${esp}</option>`).join('')}
          </select>
        </td>
        <td><input type="text" class="input-tabla" value="${escapeHtml(nombreAsignatura)}" onchange="actualizarCampoAsignatura(${i}, this.value)"></td>
        <td><input type="text" class="input-tabla" value="${escapeHtml(item.Presidente || '')}" onchange="actualizarCampo(${i}, 'Presidente', this.value)"></td>
        <td><input type="text" class="input-tabla" value="${escapeHtml(item.Secretario || '')}" onchange="actualizarCampo(${i}, 'Secretario', this.value)"></td>
        <td><input type="text" class="input-tabla" value="${escapeHtml(item.Vocal || '')}" onchange="actualizarCampo(${i}, 'Vocal', this.value)"></td>
        <td><input type="text" class="input-tabla" value="${escapeHtml(item.Suplente || '')}" onchange="actualizarCampo(${i}, 'Suplente', this.value)"></td>
        <td>
          <div class="acciones-item">
            <button class="btn-mini btn-red" onclick="eliminarFila(${i})" title="Eliminar examen">🗑️</button>
          </div>
        </td>
      </tr>
    `;
  });

  tbody.innerHTML = html;
  mensaje.style.display = "none";
  tabla.style.display = "table";
}

function actualizarCampo(index, campo, valor){
  examenesData[index][campo] = valor;
}

function actualizarCampoAsignatura(index, valor){
  // Actualiza o crea la propiedad estándar unificada asegurando compatibilidad
  examenesData[index]["Unidad Curricular/Asignatura"] = valor;
  if(examenesData[index]["Asignatura"]) delete examenesData[index]["Asignatura"];
  if(examenesData[index]["Unidad Curricular"]) delete examenesData[index]["Unidad Curricular"];
}

function actualizarActivo(index, estado){
  examenesData[index].activo = estado;
}

function agregarFilaExamen(){
  const nuevoExamen = {
    activo: true,
    Fecha: "16/11/2026",
    Hora: "8:00",
    Plan: "2023",
    Nivel: "1°",
    "D.A": "Biología",
    Especialidad: "Biología",
    "Unidad Curricular/Asignatura": "Nueva Asignatura",
    Presidente: "",
    Secretario: "",
    Vocal: "",
    Suplente: ""
  };
  examenesData.unshift(nuevoExamen);
  actualizarListasFiltros();
  filtrarYRenderizar();
  if(vistaCalendarioActiva) poblarVistaFechas();
}

function eliminarFila(index){
  if(confirm("¿Desea eliminar este examen del registro?")){
    examenesData.splice(index, 1);
    actualizarListasFilsrosBusqueda = true;
    actualizarListasFiltros();
    filtrarYRenderizar();
    if(vistaCalendarioActiva) poblarVistaFechas();
  }
}

function guardarEnFirebase(){
  const datosLimpios = examenesData.map(({ _indexReal, ...resto }) => resto);
  database.ref("gestion_examenes").set(datosLimpios).then(() => {
    alert("¡Exámenes guardados correctamente en la nube!");
  }).catch(err => {
    alert("Error al guardar: " + err.message);
  });
}

function alternarVistaFecha(){
  vistaCalendarioActiva = !vistaCalendarioActiva;
  const secGeneral = document.getElementById("seccionTablaGeneral");
  const secFecha = document.getElementById("seccionVistaFecha");

  if(vistaCalendarioActiva){
    secGeneral.style.display = "none";
    secFecha.style.display = "block";
    poblarVistaFechas();
  } else {
    secFecha.style.display = "none";
    secGeneral.style.display = "block";
    filtrarYRenderizar();
  }
}

function poblarVistaFechas(){
  const mapaFechas = {};
  examenesData.forEach(item => {
    const f = (item.Fecha || "Sin fecha").trim();
    if(!mapaFechas[f]) mapaFechas[f] = [];
    mapaFechas[f].push(item);
  });

  const fechasOrdenadas = Object.keys(mapaFechas).sort((a, b) => {
    const partesA = a.split('/');
    const partesB = b.split('/');
    if(partesA.length === 3 && partesB.length === 3){
      const dateA = new Date(partesA[2], partesA[1] - 1, partesA[0]);
      const dateB = new Date(partesB[2], partesB[1] - 1, partesB[0]);
      return dateA - dateB;
    }
    return a.localeCompare(b);
  });

  const contenedorLista = document.getElementById("listaFechasLateral");
  let htmlLista = "";

  const hoyStr = "06/11/2026"; 
  let fechaDefault = fechasOrdenadas[0];

  if(fechasOrdenadas.includes(hoyStr)){
    fechaDefault = hoyStr;
  }

  if(!fechaSeleccionadaActual || !mapaFechas[fechaSeleccionadaActual]){
    fechaSeleccionadaActual = fechaDefault;
  }

  fechasOrdenadas.forEach(fecha => {
    const cantidad = mapaFechas[fecha].length;
    const esHoy = (fecha === hoyStr);
    const etiquetaHoy = esHoy ? " ⭐ (HOY)" : "";
    const claseActiva = (fecha === fechaSeleccionadaActual) ? "active" : "";

    htmlLista += `
      <button class="fecha-item-btn ${claseActiva}" onclick="seleccionarFechaCalendario('${fecha}')">
        <span>📅 ${fecha}${etiquetaHoy}</span>
        <span class="badge-contador">${cantidad}</span>
      </button>
    `;
  });

  contenedorLista.innerHTML = htmlLista;
  mostrarDetalleFecha(fechaSeleccionadaActual, mapaFechas);
}

function seleccionarFechaCalendario(fecha){
  fechaSeleccionadaActual = fecha;
  poblarVistaFechas();
}

function mostrarDetalleFecha(fecha, mapaFechas){
  const tituloDetalle = document.getElementById("tituloDetalleFecha");
  const contenidoDetalle = document.getElementById("contenidoDetalleFecha");

  if(!fecha || !mapaFechas[fecha]){
    tituloDetalle.textContent = "Sin fecha seleccionada";
    contenidoDetalle.innerHTML = "<div class='mensaje-info'>Seleccione una fecha a la izquierda.</div>";
    return;
  }

  tituloDetalle.textContent = `Exámenes programados para el ${fecha}:`;
  const lista = mapaFechas[fecha];

  let html = `
    <table class="tabla-examenes" style="margin-top:10px;">
      <thead>
        <tr>
          <th>Hora</th>
          <th>Plan</th>
          <th>Nivel</th>
          <th>Asignatura</th>
          <th>Especialidad</th>
          <th>Tribunal (Pres. / Sec. / Voc. / Sup.)</th>
        </tr>
      </thead>
      <tbody>
  `;

  lista.forEach(ex => {
    const nombreAsig = obtenerAsignatura(ex);
    html += `
      <tr>
        <td><strong>${escapeHtml(ex.Hora)}</strong></td>
        <td>${escapeHtml(ex.Plan)}</td>
        <td>${escapeHtml(ex.Nivel)}</td>
        <td><strong>${escapeHtml(nombreAsig)}</strong></td>
        <td>${escapeHtml(ex.Especialidad)}</td>
        <td style="font-size:11px; text-align:left; padding-left:10px;">
          <div><strong>Pres:</strong> ${escapeHtml(ex.Presidente)}</div>
          <div><strong>Sec:</strong> ${escapeHtml(ex.Secretario)}</div>
          <div><strong>Voc:</strong> ${escapeHtml(ex.Vocal)}</div>
          <div><strong>Sup:</strong> ${escapeHtml(ex.Suplente)}</div>
        </td>
      </tr>
    `;
  });

  html += `</tbody></table>`;
  contenidoDetalle.innerHTML = html;
}

function descargarJSONExamenes(){
  const datosLimpios = examenesData.map(({ _indexReal, ...resto }) => resto);
  const jsonString = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(datosLimpios, null, 2));
  const downloadAnchor = document.createElement('a');
  downloadAnchor.setAttribute("href", jsonString);
  downloadAnchor.setAttribute("download", "examenes.json");
  document.body.appendChild(downloadAnchor);
  downloadAnchor.click();
  downloadAnchor.remove();
}

function escapeHtml(text){
  return String(text || "")
    .replaceAll("&","&amp;")
    .replaceAll("<","&lt;")
    .replaceAll(">","&gt;")
    .replaceAll('"',"&quot;");
}
