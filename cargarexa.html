<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Gestión y Carga de Exámenes</title>
<meta name="viewport" content="width=device-width, initial-scale=1">

<style>
*{box-sizing:border-box; user-select:none;}

body{
  margin:0;
  font-family:'Segoe UI',sans-serif;
  background:linear-gradient(to bottom right,#cceeff,#99ccff);
  padding:12px;
  color:#003b57;
  min-height:100vh;
}

.wrap{
  max-width:1450px;
  margin:0 auto;
  background:#fff;
  border-radius:18px;
  box-shadow:0 0 12px rgba(0,0,0,.12);
  overflow:hidden;
}

.top{
  padding:14px 16px;
  border-bottom:3px solid #0099cc;
}

.encabezado{
  display:flex;
  align-items:center;
  justify-content:center;
  gap:12px;
  margin-bottom:12px;
}

.title{
  font-size:22px;
  font-weight:800;
  color:#004466;
}

.controls{
  display:flex;
  gap:10px;
  align-items:center;
  flex-wrap:wrap;
  justify-content:center;
}

select,input{
  padding:8px;
  border-radius:8px;
  border:1px solid #9ed8ef;
  font-size:14px;
}

.btn{
  border:none;
  background:#0099cc;
  color:white;
  padding:8px 14px;
  border-radius:99px;
  cursor:pointer;
  font-weight:700;
  display:inline-flex;
  align-items:center;
  gap:6px;
}

.btn:hover{background:#007faa}
.btn-green{background:#00a86b}
.btn-green:hover{background:#008e5b}
.btn-red{background:#d9534f}
.btn-red:hover{background:#c9302c}
.btn-purple{background:#8e44ad}
.btn-purple:hover{background:#732d91}
.btn-guardar{background:#2980b9}
.btn-guardar:hover{background:#1f618d}
.btn-pdf{background:#e74c3c}
.btn-pdf:hover{background:#c0392b}

.vista-fecha-container{
  padding: 20px;
}

.calendario-grid{
  display: flex;
  gap: 20px;
  flex-wrap: wrap;
  align-items: flex-start;
}

.selector-fechas-box{
  flex: 1;
  min-width: 280px;
  background: #f4fbff;
  border: 2px solid #bce2f3;
  border-radius: 12px;
  padding: 16px;
  max-height: 500px;
  overflow-y: auto;
}

.fecha-item-btn{
  width: 100%;
  padding: 10px 14px;
  margin-bottom: 8px;
  background: #ffffff;
  border: 1px solid #9ed8ef;
  border-radius: 8px;
  text-align: left;
  font-weight: 700;
  color: #004466;
  cursor: pointer;
  display: flex;
  justify-content: space-between;
  align-items: center;
  transition: all 0.2s ease;
}

.fecha-item-btn:hover{
  background: #e1f3fc;
  border-color: #0099cc;
}

.fecha-item-btn.active{
  background: #0099cc;
  color: white;
  border-color: #007faa;
}

.badge-contador{
  background: #d63384;
  color: white;
  padding: 2px 8px;
  border-radius: 12px;
  font-size: 11px;
}

.fecha-item-btn.active .badge-contador{
  background: #ffffff;
  color: #0099cc;
}

.detalle-fecha-box{
  flex: 2.5;
  min-width: 320px;
  background: #ffffff;
  border: 2px solid #bce2f3;
  border-radius: 12px;
  padding: 16px;
}

.seccion-tabla{
  padding:16px;
  overflow-x:auto;
}

.subtitulo-header{
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 12px;
  flex-wrap: wrap;
  gap: 10px;
}

.subtitulo{
  font-size:18px;
  color:#005b84;
  border-left:5px solid #1aa7d6;
  padding-left:10px;
  font-weight:700;
  text-transform:uppercase;
  margin: 0;
}

table.tabla-examenes{
  width:100%;
  border-collapse:collapse;
  border-radius:10px;
  overflow:hidden;
  background:#ffffff;
}

table.tabla-examenes th, 
table.tabla-examenes td{
  border:1px solid #1aa7d6;
  padding:8px 6px;
  text-align:center;
  vertical-align:middle;
  font-size:12px;
}

table.tabla-examenes thead{
  background:#bfe8fb;
}

table.tabla-examenes th{
  color:#003f5c;
  font-weight:700;
  text-transform:uppercase;
}

.checkbox-col{
  width: 45px;
}

.checkbox-periodo{
  width: 20px;
  height: 20px;
  cursor: pointer;
  accent-color: #0099cc;
}

.input-tabla{
  width: 100%;
  padding: 4px;
  font-size: 11px;
  border: 1px solid #bce2f3;
  border-radius: 4px;
  text-align: center;
  background: #fcfefe;
}

.input-tabla:focus{
  background: #fff;
  border-color: #0099cc;
  outline: none;
}

.acciones-item{
  display: flex;
  gap: 4px;
  justify-content: center;
}

.btn-mini{
  font-size: 10px;
  padding: 3px 6px;
  border-radius: 4px;
  border: none;
  cursor: pointer;
  color: white;
}

.mensaje-info{
  text-align:center;
  padding:30px;
  color:#005b84;
  font-weight:600;
  font-size:15px;
}

@media(max-width:700px){
  body{padding:6px}
  .controls{flex-direction:column; align-items:stretch;}
  .subtitulo-header{flex-direction: column; align-items: stretch;}
  .calendario-grid{flex-direction: column;}
}
</style>
</head>

<body>

<div class="wrap">

  <div class="top">
    <div class="encabezado">
      <div class="title">Gestión y Carga de Exámenes Institucionales</div>
    </div>

    <div class="controls">
      <label>Especialidad:</label>
      <select id="filtroEspecialidad" onchange="filtrarYRenderizar()">
        <option value="">Todas las Especialidades</option>
      </select>

      <label>Nivel / Año:</label>
      <select id="filtroNivel" onchange="filtrarYRenderizar()">
        <option value="">Todos los Niveles</option>
        <option value="1°">Primero (1°)</option>
        <option value="2°">Segundo (2°)</option>
        <option value="3°">Tercero (3°)</option>
        <option value="4°">Cuarto (4°)</option>
      </select>

      <label>Plan:</label>
      <select id="filtroPlan" onchange="filtrarYRenderizar()">
        <option value="">Todos los Planes</option>
        <option value="2008">2008</option>
        <option value="2023">2023</option>
      </select>

      <!-- BUSCADOR POR UNIDAD CURRICULAR -->
      <label>Unidad Curricular:</label>
      <input type="text" id="filtroAsignatura" placeholder="Buscar materia..." oninput="filtrarYRenderizar()" style="width:160px;">

      <button class="btn btn-purple" onclick="alternarVistaFecha()">📅 Ver por Fecha</button>
      <button class="btn btn-guardar" onclick="guardarEnFirebase()">💾 Guardar Nube</button>
      <button class="btn btn-green" onclick="descargarJSONExamenes()">📥 JSON</button>
      <button class="btn btn-pdf" onclick="descargarPDFExamenes()">📄 Descargar PDF</button>
    </div>
  </div>

  <!-- VISTA GENERAL (TABLA EDITABLE) -->
  <div id="seccionTablaGeneral" class="seccion-tabla">
    <div class="subtitulo-header">
      <div class="subtitulo" id="tituloTabla">LISTADO GENERAL DE EXÁMENES</div>
      <button class="btn btn-green" type="button" onclick="agregarFilaExamen()">➕ Agregar Examen</button>
    </div>

    <div id="mensajeInfo" class="mensaje-info" style="display:none;">No se encontraron exámenes con los filtros seleccionados.</div>

    <table id="tablaExamenes" class="tabla-examenes">
      <thead>
        <tr>
          <th class="checkbox-col" title="Seleccionar si se da en el período">Período</th>
          <th>Fecha</th>
          <th>Hora</th>
          <th>Plan</th>
          <th>Nivel</th>
          <th>D.A</th>
          <th>Especialidad</th>
          <th>Asignatura / U. Curricular</th>
          <th>Presidente</th>
          <th>Secretario</th>
          <th>Vocal</th>
          <th>Suplente</th>
          <th>Acciones</th>
        </tr>
      </thead>
      <tbody id="cuerpoTablaExamenes"></tbody>
    </table>
  </div>

  <!-- VISTA CALENDARIO / POR FECHA -->
  <div id="seccionVistaFecha" class="vista-fecha-container" style="display:none;">
    <div class="subtitulo-header">
      <div class="subtitulo" id="tituloVistaFecha">EXÁMENES AGRUPADOS POR FECHA</div>
      <button class="btn" onclick="alternarVistaFecha()">⬅️ Volver al Listado General</button>
    </div>

    <div class="calendario-grid">
      <div class="selector-fechas-box" id="listaFechasLateral"></div>
      <div class="detalle-fecha-box">
        <div class="subtitulo" id="tituloDetalleFecha" style="margin-bottom: 12px; font-size:16px;">Seleccione una fecha</div>
        <div id="contenidoDetalleFecha"></div>
      </div>
    </div>
  </div>

</div>

<!-- FIREBASE UTILS -->
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>

<!-- PDFMAKE PARA GENERAR PDFS -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdfmake/0.2.7/pdfmake.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdfmake/0.2.7/vfs_fonts.js"></script>

<script>
const firebaseConfig = {
  apiKey: "AIzaSyAUbSmA64Kj6326H8-FJqSFDyb1Zzardj8",
  authDomain: "calendario-actividades-76382.firebaseapp.com",
  databaseURL: "https://calendario-actividades-76382-default-rtdb.firebaseio.com",
  projectId: "calendario-actividades-76382",
  storageBucket: "calendario-actividades-76382.firebasestorage.app",
  messagingSenderId: "455833092742",
  appId: "1:455833092742:web:eafb4950d8de8409b80707",
  measurementId: "G-YWQ92KPD0T"
};

firebase.initializeApp(firebaseConfig);
const database = firebase.database();

let examenesData = [];
let vistaCalendarioActiva = false;
let fechaSeleccionadaActual = null;

function normalizarTexto(texto) {
  return String(texto || "")
    .normalize("NFD")
    .replace(/[\u0300-\u036f]/g, "")
    .toLowerCase()
    .trim();
}

function parsearFecha(fechaStr) {
  if (!fechaStr) return new Date(0);
  const s = String(fechaStr).trim();
  if (s.includes('/')) {
    const p = s.split('/');
    if (p.length === 3) return new Date(p[2], p[1] - 1, p[0]);
  } else if (s.includes('-')) {
    const p = s.split('-');
    if (p.length === 3) {
      if (p[0].length === 4) return new Date(p[0], p[1] - 1, p[2]);
      return new Date(p[2], p[1] - 1, p[0]);
    }
  }
  return new Date(s);
}

function formatearFechaEstandar(fechaStr) {
  const d = parsearFecha(fechaStr);
  if (isNaN(d.getTime()) || d.getTime() === 0) return fechaStr || "";
  const dia = String(d.getDate()).padStart(2, '0');
  const mes = String(d.getMonth() + 1).padStart(2, '0');
  const anio = d.getFullYear();
  return `${dia}/${mes}/${anio}`;
}

function obtenerEspecialidad(item) {
  if (!item) return "";
  return item.Especialidad || item["Especialidad "] || item.especialidad || item["D_A"] || item["D.A"] || item.DA || item.Departamento || "";
}

function obtenerDA(item) {
  if (!item) return "";
  return item["D_A"] || item["D.A"] || item["DA"] || item["Departamento"] || item.Especialidad || "";
}

function obtenerAsignatura(item) {
  if (!item) return "";
  return item["Unidad Curricular_Asignatura"] || 
         item["Unidad Curricular/Asignatura"] || 
         item["Asignatura / U. Curricular"] || 
         item["Asignatura"] || 
         item["Unidad Curricular"] || "";
}

function ordenarPorFechaYHora(lista) {
  return lista.sort((a, b) => {
    const timeA = parsearFecha(a.Fecha).getTime();
    const timeB = parsearFecha(b.Fecha).getTime();
    if (timeA !== timeB) return timeA - timeB;
    return String(a.Hora || "").localeCompare(String(b.Hora || ""));
  });
}

function inicializarFiltroEspecialidades(){
  const selectEsp = document.getElementById("filtroEspecialidad");
  const valorActual = selectEsp.value;
  selectEsp.innerHTML = '<option value="">Todas las Especialidades</option>';
  
  const conjuntoEspecialidades = new Set();
  examenesData.forEach(item => {
    const esp = obtenerEspecialidad(item).trim();
    const da = obtenerDA(item).trim();
    if(esp) conjuntoEspecialidades.add(esp);
    if(da) conjuntoEspecialidades.add(da);
  });

  Array.from(conjuntoEspecialidades).sort().forEach(esp => {
    const op = document.createElement("option");
    op.value = esp;
    op.textContent = esp;
    if(esp === valorActual) op.selected = true;
    selectEsp.appendChild(op);
  });
}

function mapearExamen(item) {
  const esp = obtenerEspecialidad(item);
  const da = obtenerDA(item);
  return {
    activo: item.activo !== undefined ? item.activo : true,
    Fecha: formatearFechaEstandar(item.Fecha),
    Hora: item.Hora || "",
    Plan: item.Plan || "",
    Nivel: item.Nivel || "",
    "D_A": da,
    Especialidad: esp || da,
    "Unidad Curricular_Asignatura": obtenerAsignatura(item),
    Presidente: item.Presidente || "",
    Secretario: item.Secretario || "",
    Vocal: item.Vocal || "",
    Suplente: item.Suplente || ""
  };
}

database.ref("gestion_examenes").on("value", function(snapshot){
  const data = snapshot.val();
  if(data && Array.isArray(data)){
    examenesData = data.map(mapearExamen);
  } else if (data && typeof data === 'object') {
    examenesData = Object.values(data).map(mapearExamen);
  } else {
    examenesData = [];
  }
  ordenarPorFechaYHora(examenesData);
  inicializarFiltroEspecialidades();
  filtrarYRenderizar();
  if(vistaCalendarioActiva) poblarVistaFechas();
});

function obtenerExamenesFiltrados() {
  const espSel = normalizarTexto(document.getElementById("filtroEspecialidad").value);
  const nivelSel = normalizarTexto(document.getElementById("filtroNivel").value);
  const planSel = document.getElementById("filtroPlan").value;
  const asigSel = normalizarTexto(document.getElementById("filtroAsignatura").value);

  const filtrados = examenesData.map((item, index) => ({ ...item, _indexReal: index }))
    .filter((item) => {
      const itemEsp = normalizarTexto(item.Especialidad || "");
      const itemDA = normalizarTexto(item["D_A"] || "");
      const itemNivel = normalizarTexto(item.Nivel || "");
      const itemPlan = String(item.Plan || "").trim();
      const itemAsig = normalizarTexto(item["Unidad Curricular_Asignatura"] || "");

      const matchEsp = !espSel || itemEsp.includes(espSel) || itemDA.includes(espSel);
      const numNivelSel = nivelSel.replace(/[^0-9]/g, '');
      const numItemNivel = itemNivel.replace(/[^0-9]/g, '');
      const matchNivel = !nivelSel || (numNivelSel ? numNivelSel === numItemNivel : itemNivel.includes(nivelSel));
      const matchPlan = !planSel || itemPlan === planSel;
      const matchAsig = !asigSel || itemAsig.includes(asigSel);

      return matchEsp && matchNivel && matchPlan && matchAsig;
    });

  return ordenarPorFechaYHora(filtrados);
}

function filtrarYRenderizar(){
  const filtrados = obtenerExamenesFiltrados();
  const tbody = document.getElementById("cuerpoTablaExamenes");
  const mensaje = document.getElementById("mensajeInfo");
  const tabla = document.getElementById("tablaExamenes");

  if(filtrados.length === 0){
    tabla.style.display = "none";
    mensaje.style.display = "block";
    tbody.innerHTML = "";
    return;
  }

  let html = "";
  filtrados.forEach((item) => {
    const i = item._indexReal;
    const nombreAsignatura = item["Unidad Curricular_Asignatura"];
    const deptoAcademico = item["D_A"];

    html += `
      <tr>
        <td class="checkbox-col">
          <input type="checkbox" class="checkbox-periodo" ${item.activo ? "checked" : ""} onchange="actualizarActivo(${i}, this.checked)">
        </td>
        <td><input type="text" class="input-tabla" value="${escapeHtml(item.Fecha)}" onchange="actualizarCampo(${i}, 'Fecha', this.value)"></td>
        <td><input type="text" class="input-tabla" style="width:70px;" value="${escapeHtml(item.Hora)}" onchange="actualizarCampo(${i}, 'Hora', this.value)"></td>
        <td>
          <input type="text" class="input-tabla" style="width:60px;" value="${escapeHtml(item.Plan)}" onchange="actualizarCampo(${i}, 'Plan', this.value)">
        </td>
        <td>
          <input type="text" class="input-tabla" style="width:50px;" value="${escapeHtml(item.Nivel)}" onchange="actualizarCampo(${i}, 'Nivel', this.value)">
        </td>
        <td><input type="text" class="input-tabla" style="width:80px;" value="${escapeHtml(deptoAcademico)}" onchange="actualizarCampo(${i}, 'D_A', this.value)"></td>
        <td>
          <input type="text" class="input-tabla" value="${escapeHtml(item.Especialidad || deptoAcademico)}" onchange="actualizarCampo(${i}, 'Especialidad', this.value)">
        </td>
        <td><input type="text" class="input-tabla" value="${escapeHtml(nombreAsignatura)}" onchange="actualizarAsignatura(${i}, this.value)"></td>
        <td><input type="text" class="input-tabla" value="${escapeHtml(item.Presidente)}" onchange="actualizarCampo(${i}, 'Presidente', this.value)"></td>
        <td><input type="text" class="input-tabla" value="${escapeHtml(item.Secretario)}" onchange="actualizarCampo(${i}, 'Secretario', this.value)"></td>
        <td><input type="text" class="input-tabla" value="${escapeHtml(item.Vocal)}" onchange="actualizarCampo(${i}, 'Vocal', this.value)"></td>
        <td><input type="text" class="input-tabla" value="${escapeHtml(item.Suplente)}" onchange="actualizarCampo(${i}, 'Suplente', this.value)"></td>
        <td>
          <div class="acciones-item">
            <button type="button" class="btn-mini btn-red" onclick="eliminarFila(${i})" title="Eliminar examen">🗑️</button>
          </div>
        </td>
      </tr>
    `;
  });

  tbody.innerHTML = html;
  mensaje.style.display = "none";
  tabla.style.display = "table";
}

function actualizarCampo(index, campo, valor){
  if(campo === 'Fecha') valor = formatearFechaEstandar(valor);
  examenesData[index][campo] = valor;
  if(campo === 'Fecha' || campo === 'Hora') ordenarPorFechaYHora(examenesData);
  if(campo === 'Especialidad' || campo === 'D_A') inicializarFiltroEspecialidades();
  filtrarYRenderizar();
  guardarEnFirebaseSilencioso();
}

function actualizarAsignatura(index, valor){
  examenesData[index]["Unidad Curricular_Asignatura"] = valor;
  guardarEnFirebaseSilencioso();
}

function actualizarActivo(index, estado){
  examenesData[index].activo = estado;
  guardarEnFirebaseSilencioso();
}

function agregarFilaExamen(){
  const nuevoExamen = {
    activo: true,
    Fecha: "16/11/2026",
    Hora: "08:00",
    Plan: "2023",
    Nivel: "1°",
    "D_A": "Informática",
    Especialidad: "Informática",
    "Unidad Curricular_Asignatura": "Nueva Asignatura",
    Presidente: "",
    Secretario: "",
    Vocal: "",
    Suplente: ""
  };
  examenesData.unshift(nuevoExamen);
  ordenarPorFechaYHora(examenesData);
  inicializarFiltroEspecialidades();
  filtrarYRenderizar();
  if(vistaCalendarioActiva) poblarVistaFechas();
  guardarEnFirebaseSilencioso();
}

function eliminarFila(index){
  if(confirm("¿Desea eliminar este examen del registro?")){
    examenesData.splice(index, 1);
    inicializarFiltroEspecialidades();
    filtrarYRenderizar();
    if(vistaCalendarioActiva) poblarVistaFechas();
    guardarEnFirebaseSilencioso();
  }
}

function guardarEnFirebaseSilencioso(){
  const datosLimpios = examenesData.map(({ _indexReal, ...resto }) => resto);
  database.ref("gestion_examenes").set(datosLimpios);
}

function guardarEnFirebase(){
  const datosLimpios = examenesData.map(({ _indexReal, ...resto }) => resto);
  database.ref("gestion_examenes").set(datosLimpios).then(() => {
    alert("¡Exámenes guardados correctamente en la nube!");
  }).catch(err => {
    alert("Error al guardar: " + err.message);
  });
}

function alternarVistaFecha(){
  vistaCalendarioActiva = !vistaCalendarioActiva;
  const secGeneral = document.getElementById("seccionTablaGeneral");
  const secFecha = document.getElementById("seccionVistaFecha");

  if(vistaCalendarioActiva){
    secGeneral.style.display = "none";
    secFecha.style.display = "block";
    poblarVistaFechas();
  } else {
    secFecha.style.display = "none";
    secGeneral.style.display = "block";
    filtrarYRenderizar();
  }
}

function poblarVistaFechas(){
  const mapaFechas = {};
  examenesData.forEach(item => {
    const f = (item.Fecha || "Sin fecha").trim();
    if(!mapaFechas[f]) mapaFechas[f] = [];
    mapaFechas[f].push(item);
  });

  const fechasOrdenadas = Object.keys(mapaFechas).sort((a, b) => parsearFecha(a) - parsearFecha(b));

  const contenedorLista = document.getElementById("listaFechasLateral");
  let htmlLista = "";

  const hoy = new Date();
  const hoyStr = `${String(hoy.getDate()).padStart(2, '0')}/${String(hoy.getMonth() + 1).padStart(2, '0')}/${hoy.getFullYear()}`;
  let fechaDefault = fechasOrdenadas[0];

  if(fechasOrdenadas.includes(hoyStr)){
    fechaDefault = hoyStr;
  }

  if(!fechaSeleccionadaActual || !mapaFechas[fechaSeleccionadaActual]){
    fechaSeleccionadaActual = fechaDefault;
  }

  fechasOrdenadas.forEach(fecha => {
    const cantidad = mapaFechas[fecha].length;
    const esHoy = (fecha === hoyStr);
    const etiquetaHoy = esHoy ? " ⭐ (HOY)" : "";
    const claseActiva = (fecha === fechaSeleccionadaActual) ? "active" : "";

    htmlLista += `
      <button class="fecha-item-btn ${claseActiva}" onclick="seleccionarFechaCalendario('${fecha}')">
        <span>📅 ${fecha}${etiquetaHoy}</span>
        <span class="badge-contador">${cantidad}</span>
      </button>
    `;
  });

  contenedorLista.innerHTML = htmlLista;
  mostrarDetalleFecha(fechaSeleccionadaActual, mapaFechas);
}

function seleccionarFechaCalendario(fecha){
  fechaSeleccionadaActual = fecha;
  poblarVistaFechas();
}

function mostrarDetalleFecha(fecha, mapaFechas){
  const tituloDetalle = document.getElementById("tituloDetalleFecha");
  const contenidoDetalle = document.getElementById("contenidoDetalleFecha");

  if(!fecha || !mapaFechas[fecha]){
    tituloDetalle.textContent = "Sin fecha seleccionada";
    contenidoDetalle.innerHTML = "<div class='mensaje-info'>Seleccione una fecha a la izquierda.</div>";
    return;
  }

  tituloDetalle.textContent = `Exámenes programados para el ${fecha}:`;
  const lista = ordenarPorFechaYHora(mapaFechas[fecha]);

  let html = `
    <table class="tabla-examenes" style="margin-top:10px;">
      <thead>
        <tr>
          <th>Hora</th>
          <th>Plan</th>
          <th>Nivel</th>
          <th>Asignatura</th>
          <th>Especialidad</th>
          <th>Presidente</th>
          <th>Secretario</th>
          <th>Vocal</th>
          <th>Suplente</th>
        </tr>
      </thead>
      <tbody>
  `;

  lista.forEach(ex => {
    html += `
      <tr>
        <td><strong>${escapeHtml(ex.Hora)}</strong></td>
        <td>${escapeHtml(ex.Plan)}</td>
        <td>${escapeHtml(ex.Nivel)}</td>
        <td><strong>${escapeHtml(ex["Unidad Curricular_Asignatura"])}</strong></td>
        <td>${escapeHtml(ex.Especialidad || ex["D_A"])}</td>
        <td>${escapeHtml(ex.Presidente)}</td>
        <td>${escapeHtml(ex.Secretario)}</td>
        <td>${escapeHtml(ex.Vocal)}</td>
        <td>${escapeHtml(ex.Suplente)}</td>
      </tr>
    `;
  });

  html += `</tbody></table>`;
  contenidoDetalle.innerHTML = html;
}

function descargarJSONExamenes(){
  const datosLimpios = examenesData.map(({ _indexReal, ...resto }) => resto);
  const jsonString = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(datosLimpios, null, 2));
  const downloadAnchor = document.createElement('a');
  downloadAnchor.setAttribute("href", jsonString);
  downloadAnchor.setAttribute("download", "examenes.json");
  document.body.appendChild(downloadAnchor);
  downloadAnchor.click();
  downloadAnchor.remove();
}

function descargarPDFExamenes(){
  const filtrados = obtenerExamenesFiltrados();

  if (filtrados.length === 0) {
    alert("No hay exámenes para exportar en el PDF.");
    return;
  }

  const grupos = {};
  filtrados.forEach(item => {
    const esp = item.Especialidad || item["D_A"] || "Sin Especialidad";
    if (!grupos[esp]) grupos[esp] = [];
    grupos[esp].push(item);
  });

  const docDefinition = {
    pageSize: 'A4',
    pageOrientation: 'landscape',
    pageMargins: [20, 30, 20, 30],
    header: function(currentPage, pageCount) {
      return {
        text: `Calendario de Exámenes - Período Institucional (Pág. ${currentPage} de ${pageCount})`,
        alignment: 'right',
        fontSize: 8,
        color: '#777777',
        margin: [0, 10, 20, 0]
      };
    },
    content: [
      { text: 'CALENDARIO DE EXÁMENES E EVALUACIONES', style: 'mainHeader' },
      { text: `Generado el: ${new Date().toLocaleDateString('es-ES')}`, style: 'subHeader' },
      { text: ' ', margin: [0, 4] }
    ],
    styles: {
      mainHeader: {
        fontSize: 16,
        bold: true,
        alignment: 'center',
        color: '#004466'
      },
      subHeader: {
        fontSize: 9,
        alignment: 'center',
        color: '#555555',
        margin: [0, 2, 0, 8]
      },
      groupHeader: {
        fontSize: 12,
        bold: true,
        color: '#ffffff',
        fillColor: '#005b84',
        margin: [0, 8, 0, 4],
        padding: 4
      },
      tableHeader: {
        bold: true,
        fontSize: 8,
        color: '#003f5c',
        fillColor: '#bfe8fb',
        alignment: 'center'
      },
      tableBody: {
        fontSize: 8,
        alignment: 'center'
      }
    }
  };

  Object.keys(grupos).sort().forEach(esp => {
    docDefinition.content.push({
      table: {
        widths: ['*'],
        body: [[{ text: `ESPECIALIDAD: ${esp.toUpperCase()}`, style: 'groupHeader' }]]
      },
      layout: 'noBorders'
    });

    const rows = [
      [
        { text: 'Fecha', style: 'tableHeader' },
        { text: 'Hora', style: 'tableHeader' },
        { text: 'Plan', style: 'tableHeader' },
        { text: 'Nivel', style: 'tableHeader' },
        { text: 'D.A', style: 'tableHeader' },
        { text: 'Especialidad', style: 'tableHeader' },
        { text: 'Unidad Curricular / Asignatura', style: 'tableHeader' },
        { text: 'Presidente', style: 'tableHeader' },
        { text: 'Secretario', style: 'tableHeader' },
        { text: 'Vocal', style: 'tableHeader' },
        { text: 'Suplente', style: 'tableHeader' }
      ]
    ];

    grupos[esp].forEach(item => {
      rows.push([
        { text: item.Fecha || '', style: 'tableBody' },
        { text: item.Hora || '', style: 'tableBody' },
        { text: item.Plan || '', style: 'tableBody' },
        { text: item.Nivel || '', style: 'tableBody' },
        { text: item["D_A"] || '', style: 'tableBody' },
        { text: item.Especialidad || '', style: 'tableBody' },
        { text: item["Unidad Curricular_Asignatura"] || '', style: 'tableBody', alignment: 'left' },
        { text: item.Presidente || '', style: 'tableBody', alignment: 'left' },
        { text: item.Secretario || '', style: 'tableBody', alignment: 'left' },
        { text: item.Vocal || '', style: 'tableBody', alignment: 'left' },
        { text: item.Suplente || '', style: 'tableBody', alignment: 'left' }
      ]);
    });

    docDefinition.content.push({
      table: {
        headerRows: 1,
        widths: [55, 35, 30, 30, 50, 55, '*', 85, 85, 85, 85],
        body: rows
      },
      layout: {
        hLineWidth: function (i, node) { return 0.5; },
        vLineWidth: function (i, node) { return 0.5; },
        hLineColor: function (i, node) { return '#1aa7d6'; },
        vLineColor: function (i, node) { return '#1aa7d6'; }
      },
      margin: [0, 0, 0, 10]
    });
  });

  pdfMake.createPdf(docDefinition).download(`calendario_examenes_${new Date().getTime()}.pdf`);
}

function escapeHtml(text){
  return String(text || "")
    .replaceAll("&","&amp;")
    .replaceAll("<","&lt;")
    .replaceAll(">","&gt;")
    .replaceAll('"',"&quot;");
}
