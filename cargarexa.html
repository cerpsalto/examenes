<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Gestión y Carga de Exámenes</title>
<meta name="viewport" content="width=device-width, initial-scale=1">

<style>
*{box-sizing:border-box; user-select:none;}

body{
  margin:0;
  font-family:'Segoe UI',sans-serif;
  background:linear-gradient(to bottom right,#cceeff,#99ccff);
  padding:12px;
  color:#003b57;
  min-height:100vh;
}

.wrap{
  max-width:1450px;
  margin:0 auto;
  background:#fff;
  border-radius:18px;
  box-shadow:0 0 12px rgba(0,0,0,.12);
  overflow:hidden;
}

.top{
  padding:14px 16px;
  border-bottom:3px solid #0099cc;
}

.encabezado{
  display:flex;
  align-items:center;
  justify-content:center;
  gap:12px;
  margin-bottom:12px;
}

.title{
  font-size:22px;
  font-weight:800;
  color:#004466;
}

.controls{
  display:flex;
  gap:10px;
  align-items:center;
  flex-wrap:wrap;
  justify-content:center;
}

select,input{
  padding:8px;
  border-radius:8px;
  border:1px solid #9ed8ef;
  font-size:14px;
}

.btn{
  border:none;
  background:#0099cc;
  color:white;
  padding:8px 14px;
  border-radius:9px;
  cursor:pointer;
  font-weight:700;
}

.btn:hover{background:#007faa}

.btn-green{background:#00a86b}
.btn-green:hover{background:#008e5b}

.btn-red{background:#d9534f}
.btn-red:hover{background:#c9302c}

/* TABLA EXÁMENES */
.seccion-tabla{
  padding:16px;
  overflow-x:auto;
}

.subtitulo-header{
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 12px;
  flex-wrap: wrap;
  gap: 10px;
}

.subtitulo{
  font-size:18px;
  color:#005b84;
  border-left:5px solid #1aa7d6;
  padding-left:10px;
  font-weight:700;
  text-transform:uppercase;
  margin: 0;
}

table.tabla-examenes{
  width:100%;
  border-collapse:collapse;
  border-radius:10px;
  overflow:hidden;
  background:#ffffff;
}

table.tabla-examenes th, 
table.tabla-examenes td{
  border:1px solid #1aa7d6;
  padding:8px 6px;
  text-align:center;
  vertical-align:middle;
  font-size:12px;
}

table.tabla-examenes thead{
  background:#bfe8fb;
}

table.tabla-examenes th{
  color:#003f5c;
  font-weight:700;
  text-transform:uppercase;
}

.checkbox-col{
  width: 45px;
}

.checkbox-periodo{
  width: 20px;
  height: 20px;
  cursor: pointer;
  accent-color: #0099cc;
}

.input-tabla{
  width: 100%;
  padding: 4px;
  font-size: 11px;
  border: 1px solid #bce2f3;
  border-radius: 4px;
  text-align: center;
  background: #fcfefe;
}

.input-tabla:focus{
  background: #fff;
  border-color: #0099cc;
  outline: none;
}

.acciones-item{
  display: flex;
  gap: 4px;
  justify-content: center;
}

.btn-mini{
  font-size: 10px;
  padding: 3px 6px;
  border-radius: 4px;
  border: none;
  cursor: pointer;
  color: white;
}

.mensaje-info{
  text-align:center;
  padding:30px;
  color:#005b84;
  font-weight:600;
  font-size:15px;
}

@media(max-width:700px){
  body{padding:6px}
  .controls{flex-direction:column; align-items:stretch;}
  .subtitulo-header{flex-direction: column; align-items: stretch;}
}
</style>
</head>

<body>

<div class="wrap">

  <div class="top">
    <div class="encabezado">
      <div class="title">Gestión y Carga de Exámenes Institucionales</div>
    </div>

    <div class="controls">
      <label>Especialidad:</label>
      <select id="filtroEspecialidad" onchange="filtrarYRenderizar()">
        <option value="">-- Todas las Especialidades --</option>
      </select>

      <label>Nivel / Año:</label>
      <select id="filtroNivel" onchange="filtrarYRenderizar()">
        <option value="">-- Todos los Niveles --</option>
        <option value="1°">Primero (1°)</option>
        <option value="2°">Segundo (2°)</option>
        <option value="3°">Tercero (3°)</option>
        <option value="4°">Cuarto (4°)</option>
      </select>

      <label>Plan:</label>
      <select id="filtroPlan" onchange="filtrarYRenderizar()">
        <option value="">-- Todos los Planes --</option>
        <option value="2008">2008</option>
        <option value="2023">2023</option>
        <option value="2027">2027</option>
      </select>

      <button class="btn btn-green" onclick="descargarJSONExamenes()">📥 Generar y Descargar JSON</button>
    </div>
  </div>

  <div class="seccion-tabla">
    <div class="subtitulo-header">
      <div class="subtitulo" id="tituloTabla">LISTADO GENERAL DE EXÁMENES</div>
      <button class="btn btn-green" onclick="agregarFilaExamen()">➕ Agregar Examen</button>
    </div>

    <div id="mensajeInfo" class="mensaje-info" style="display:none;">No se encontraron exámenes con los filtros seleccionados.</div>

    <table id="tablaExamenes" class="tabla-examenes">
      <thead>
        <tr>
          <th class="checkbox-col" title="Seleccionar si se da en el período">Período</th>
          <th>Fecha</th>
          <th>Hora</th>
          <th>Plan</th>
          <th>Nivel</th>
          <th>D.A</th>
          <th>Especialidad</th>
          <th>Asignatura / U. Curricular</th>
          <th>Presidente</th>
          <th>Secretario</th>
          <th>Vocal</th>
          <th>Suplente</th>
          <th>Acciones</th>
        </tr>
      </thead>
      <tbody id="cuerpoTablaExamenes"></tbody>
    </table>
  </div>

</div>

<script>
const listaEspecialidadesBase = [
  "Biología", "Com. Visual", "Derecho", "Español",
  "Física", "Geografía", "Historia", "Informática",
  "Inglés", "Literatura", "Matemática", "Química",
  "Trayecto equivalente", "Maestro Técnico", "Filosofía"
];

let examenesData = [];

// Inicializar selector de especialidades en filtros
function inicializarFiltros(){
  const selectEsp = document.getElementById("filtroEspecialidad");
  listaEspecialidadesBase.forEach(esp => {
    const op = document.createElement("option");
    op.value = esp;
    op.textContent = esp;
    selectEsp.appendChild(op);
  });
}

// Cargar el JSON remoto al iniciar
function cargarExamenesRemotos(){
  fetch("https://cerpsalto.github.io/examenes/examenes.json")
    .then(res => res.json())
    .then(data => {
      // Si el JSON no trae la propiedad "activo", la inicializamos por defecto en true (o false según prefieras)
      examenesData = data.map(item => ({
        ...item,
        activo: item.activo !== undefined ? item.activo : true 
      }));
      filtrarYRenderizar();
    })
    .catch(err => {
      console.warn("No se pudo cargar examenes.json remoto, iniciando vacío.", err);
      examenesData = [];
      filtrarYRenderizar();
    });
}

inicializarFiltros();
cargarExamenesRemotos();

function filtrarYRenderizar(){
  const espSel = document.getElementById("filtroEspecialidad").value.toLowerCase();
  const nivelSel = document.getElementById("filtroNivel").value.toLowerCase();
  const planSel = document.getElementById("filtroPlan").value;

  const tbody = document.getElementById("cuerpoTablaExamenes");
  const mensaje = document.getElementById("mensajeInfo");
  const tabla = document.getElementById("tablaExamenes");

  const filtrados = examenesData.filter((item, index) => {
    // Guardamos el índice real para editar/borrar correctamente sobre el array maestro
    item._indexReal = index; 

    const matchEsp = !espSel || (item.Especialidad && item.Especialidad.toLowerCase() === espSel);
    const matchNivel = !nivelSel || (item.Nivel && item.Nivel.toLowerCase() === nivelSel);
    const matchPlan = !planSel || (item.Plan && String(item.Plan) === String(planSel));

    return matchEsp && matchNivel && matchPlan;
  });

  if(filtrados.length === 0){
    tabla.style.display = "none";
    mensaje.style.display = "block";
    return;
  }

  let html = "";
  filtrados.forEach((item) => {
    const i = item._indexReal;
    html += `
      <tr>
        <td class="checkbox-col">
          <input type="checkbox" class="checkbox-periodo" ${item.activo ? "checked" : ""} onchange="actualizarActivo(${i}, this.checked)">
        </td>
        <td><input type="text" class="input-tabla" value="${escapeHtml(item.Fecha || '')}" onchange="actualizarCampo(${i}, 'Fecha', this.value)"></td>
        <td><input type="text" class="input-tabla" style="width:70px;" value="${escapeHtml(item.Hora || '')}" onchange="actualizarCampo(${i}, 'Hora', this.value)"></td>
        <td>
          <select class="input-tabla" onchange="actualizarCampo(${i}, 'Plan', this.value)">
            <option value="2008" ${item.Plan === '2008' ? 'selected' : ''}>2008</option>
            <option value="2023" ${item.Plan === '2023' ? 'selected' : ''}>2023</option>
            <option value="2027" ${item.Plan === '2027' ? 'selected' : ''}>2027</option>
          </select>
        </td>
        <td>
          <select class="input-tabla" onchange="actualizarCampo(${i}, 'Nivel', this.value)">
            <option value="1°" ${item.Nivel === '1°' ? 'selected' : ''}>1°</option>
            <option value="2°" ${item.Nivel === '2°' ? 'selected' : ''}>2°</option>
            <option value="3°" ${item.Nivel === '3°' ? 'selected' : ''}>3°</option>
            <option value="4°" ${item.Nivel === '4°' ? 'selected' : ''}>4°</option>
          </select>
        </td>
        <td><input type="text" class="input-tabla" style="width:80px;" value="${escapeHtml(item["D.A"] || '')}" onchange="actualizarCampo(${i}, 'D.A', this.value)"></td>
        <td>
          <select class="input-tabla" onchange="actualizarCampo(${i}, 'Especialidad', this.value)">
            ${listaEspecialidadesBase.map(esp => `<option value="${esp}" ${item.Especialidad === esp ? 'selected' : ''}>${esp}</option>`).join('')}
          </select>
        </td>
        <td><input type="text" class="input-tabla" value="${escapeHtml(item["Unidad Curricular/Asignatura"] || '')}" onchange="actualizarCampo(${i}, 'Unidad Curricular/Asignatura', this.value)"></td>
        <td><input type="text" class="input-tabla" value="${escapeHtml(item.Presidente || '')}" onchange="actualizarCampo(${i}, 'Presidente', this.value)"></td>
        <td><input type="text" class="input-tabla" value="${escapeHtml(item.Secretario || '')}" onchange="actualizarCampo(${i}, 'Secretario', this.value)"></td>
        <td><input type="text" class="input-tabla" value="${escapeHtml(item.Vocal || '')}" onchange="actualizarCampo(${i}, 'Vocal', this.value)"></td>
        <td><input type="text" class="input-tabla" value="${escapeHtml(item.Suplente || '')}" onchange="actualizarCampo(${i}, 'Suplente', this.value)"></td>
        <td>
          <div class="acciones-item">
            <button class="btn-mini btn-red" onclick="eliminarFila(${i})" title="Eliminar examen">🗑️</button>
          </div>
        </td>
      </tr>
    `;
  });

  tbody.innerHTML = html;
  mensaje.style.display = "none";
  tabla.style.display = "table";
}

function actualizarCampo(index, campo, valor){
  examenesData[index][campo] = valor;
}

function actualizarActivo(index, estado){
  examenesData[index].activo = estado;
}

function agregarFilaExamen(){
  const nuevoExamen = {
    activo: true,
    Fecha: "16/11/2026",
    Hora: "8:00",
    Plan: "2023",
    Nivel: "1°",
    "D.A": "Biología",
    Especialidad: "Biología",
    "Unidad Curricular/Asignatura": "Nueva Asignatura",
    Presidente: "",
    Secretario: "",
    Vocal: "",
    Suplente: ""
  };
  examenesData.unshift(nuevoExamen);
  filtrarYRenderizar();
}

function eliminarFila(index){
  if(confirm("¿Desea eliminar este examen del registro?")){
    examenesData.splice(index, 1);
    filtrarYRenderizar();
  }
}

function descargarJSONExamenes(){
  // Limpiamos la propiedad interna _indexReal antes de exportar
  const datosLimpios = examenesData.map(({ _indexReal, ...resto }) => resto);

  const jsonString = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(datosLimpios, null, 2));
  const downloadAnchor = document.createElement('a');
  downloadAnchor.setAttribute("href", jsonString);
  downloadAnchor.setAttribute("download", "examenes.json");
  document.body.appendChild(downloadAnchor);
  downloadAnchor.click();
  downloadAnchor.remove();
}

function escapeHtml(text){
  return String(text || "")
    .replaceAll("&","&amp;")
    .replaceAll("<","&lt;")
    .replaceAll(">","&gt;")
    .replaceAll('"',"&quot;");
}
</script>

</body>
</html>
