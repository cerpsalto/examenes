<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Calendario mensual de actividades</title>
<meta name="viewport" content="width=device-width, initial-scale=1">

<style>
*{box-sizing:border-box}

body{
  margin:0;
  font-family:'Segoe UI',sans-serif;
  background:linear-gradient(to bottom right,#cceeff,#99ccff);
  padding:14px;
  color:#003b57;
}

.wrap{
  max-width:1300px;
  margin:0 auto;
  background:#fff;
  border-radius:18px;
  box-shadow:0 0 12px rgba(0,0,0,.12);
  overflow:hidden;
}

.top{
  padding:14px 16px;
  border-bottom:3px solid #0099cc;
}

.title{
  font-size:22px;
  font-weight:800;
  color:#004466;
  margin-bottom:12px;
}

.controls{
  display:flex;
  gap:8px;
  align-items:center;
  flex-wrap:wrap;
}

select,input{
  padding:8px;
  border-radius:8px;
  border:1px solid #9ed8ef;
  font-size:14px;
}

.btn{
  border:none;
  background:#0099cc;
  color:white;
  padding:8px 11px;
  border-radius:9px;
  cursor:pointer;
  font-weight:700;
}

.btn:hover{background:#007faa}

.btn-green{background:#00a86b}
.btn-green:hover{background:#008e5b}

.btn-dark{background:#004466}
.btn-dark:hover{background:#00334f}

.aviso{
  padding:10px 16px;
  font-size:13px;
  background:#f1fbff;
  border-bottom:1px solid #cdefff;
}

.vista-grafica{
  display:block;
  padding:16px;
}

.grid-calendario{
  display:grid;
  grid-template-columns:repeat(auto-fill,minmax(230px,1fr));
  gap:12px;
}

.dia-card{
  border:2px solid #d7edf8;
  border-radius:14px;
  background:#f8fcff;
  padding:10px;
  min-height:150px;
}

.dia-card.hoy-card{
  border-color:#e6c800;
  background:#fffbea;
}

.dia-header{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:8px;
  margin-bottom:8px;
}

.dia-numero{
  font-size:18px;
  font-weight:900;
  color:#004466;
}

.btn-mas{
  border:none;
  background:#00a86b;
  color:white;
  width:34px;
  height:34px;
  border-radius:50%;
  font-size:22px;
  font-weight:900;
  cursor:pointer;
  line-height:30px;
}

.btn-mas:hover{
  background:#008e5b;
}

.evento-card{
  background:white;
  border-left:5px solid #0099cc;
  border-radius:8px;
  padding:8px;
  margin-bottom:8px;
  box-shadow:0 1px 4px rgba(0,0,0,.08);
}

.evento-top{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:8px;
}

.evento-turno{
  font-size:13px;
  font-weight:900;
  color:#004466;
}

.evento-acciones{
  font-size:12px;
  padding:5px;
  border-radius:7px;
}

.evento-hora-grande{
  font-size:18px;
  font-weight:900;
  color:#007faa;
  margin:3px 0;
}

.evento-nombre{
  font-size:14px;
  font-weight:700;
}

.sin-actividad-card{
  color:#7b929c;
  font-size:13px;
  text-align:center;
  margin-top:25px;
}

.panel-reporte{
  display:none;
  padding:16px;
  background:#f8fcff;
  border-bottom:2px solid #d7edf8;
}

.reporte-controles{
  display:flex;
  gap:10px;
  flex-wrap:wrap;
  align-items:end;
  margin-bottom:14px;
}

.reporte-controles label{
  font-weight:700;
  font-size:14px;
}

.reporte-campo{
  display:flex;
  flex-direction:column;
  gap:5px;
}

.reporte-lista{
  background:white;
  border-radius:12px;
  border:1px solid #d7edf8;
  padding:12px;
}

.reporte-item{
  border-bottom:1px solid #e6f2fa;
  padding:10px 0;
}

.reporte-item:last-child{
  border-bottom:none;
}

.reporte-fecha{
  font-weight:900;
  color:#004466;
}

.reporte-actividad{
  margin-top:4px;
  font-size:15px;
}

.modal{
  display:none;
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.35);
  justify-content:center;
  align-items:center;
  padding:14px;
  z-index:1000;
}

.modal-contenido{
  background:white;
  width:100%;
  max-width:420px;
  border-radius:16px;
  padding:18px;
  box-shadow:0 0 20px rgba(0,0,0,.25);
}

.modal-titulo{
  font-size:22px;
  font-weight:900;
  color:#004466;
  margin-bottom:14px;
}

.form-grupo{
  display:flex;
  flex-direction:column;
  gap:6px;
  margin-bottom:12px;
}

.form-grupo label{
  font-weight:800;
}

.form-grupo input,
.form-grupo select{
  width:100%;
  font-size:16px;
  padding:10px;
}

.modal-botones{
  display:flex;
  gap:8px;
  justify-content:flex-end;
  flex-wrap:wrap;
}

.btn-cancelar{
  background:#777;
}

.btn-cancelar:hover{
  background:#555;
}

.btn-danger{
  background:#d9534f;
}

.btn-danger:hover{
  background:#c9302c;
}

.oculto{
  display:none;
}

@media(max-width:700px){

  body{
    padding:6px;
  }

  .wrap{
    border-radius:12px;
  }

  .top{
    padding:12px;
  }

  .title{
    font-size:20px;
    text-align:center;
  }

  .controls,
  .reporte-controles{
    flex-direction:column;
    align-items:stretch;
  }

  .controls label{
    font-weight:700;
  }

  .controls select,
  .controls input,
  .btn,
  .reporte-controles input{
    width:100%;
    font-size:16px;
    padding:12px;
  }

  .aviso{
    font-size:14px;
    text-align:center;
  }

  .grid-calendario{
    grid-template-columns:1fr;
  }

  .dia-card{
    min-height:auto;
  }

  .dia-numero{
    font-size:24px;
  }

  .btn-mas{
    width:42px;
    height:42px;
    font-size:28px;
  }

  .evento-card{
    padding:12px;
  }

  .evento-turno{
    font-size:16px;
  }

  .evento-hora-grande{
    font-size:24px;
  }

  .evento-nombre{
    font-size:18px;
  }

  .evento-acciones{
    font-size:15px;
    padding:8px;
  }
}

@media print{
  body{
    background:white;
    padding:0;
  }

  .top,
  .aviso,
  .vista-grafica,
  .btn,
  .modal{
    display:none !important;
  }

  .wrap{
    box-shadow:none;
    border-radius:0;
  }

  .panel-reporte{
    display:block !important;
    border:none;
    background:white;
  }

  .reporte-controles{
    display:none;
  }

  .reporte-lista{
    border:none;
  }
}
</style>
</head>

<body>

<div class="wrap">

  <div class="top">
    <div class="title">Calendario mensual de actividades</div>

    <div class="controls">
      <label>Mes:</label>
      <select id="mes" onchange="cambioMesAnio()"></select>

      <label>Año:</label>
      <input type="number" id="anio" min="2020" max="2100" onchange="cambioMesAnio()">

      <button class="btn" onclick="alternarAnteriores()" id="btnAnteriores">Ver días anteriores</button>

      <button class="btn btn-dark" onclick="alternarReporte()" id="btnReporte">Reporte de actividades</button>

      <input type="text" id="buscador" placeholder="Buscar evento..." oninput="buscarEventos()">
    </div>
  </div>

  <div class="aviso">
    El calendario guarda automáticamente en línea. Los cambios se ven desde todas las computadoras.
  </div>

  <div class="panel-reporte" id="panelReporte">
    <div class="reporte-controles">
      <div class="reporte-campo">
        <label>Desde:</label>
        <input type="date" id="fechaDesde">
      </div>

      <div class="reporte-campo">
        <label>Hasta:</label>
        <input type="date" id="fechaHasta">
      </div>

      <button class="btn btn-green" onclick="generarReporte()">Generar reporte</button>
      <button class="btn" onclick="window.print()">Imprimir reporte</button>
    </div>

    <div class="reporte-lista" id="reporteLista">
      Seleccione un rango de fechas para generar el reporte.
    </div>
  </div>

  <div class="vista-grafica" id="vistaGrafica">
    <div class="grid-calendario" id="gridCalendario"></div>
  </div>

</div>

<div class="modal" id="modalEvento">
  <div class="modal-contenido">
    <div class="modal-titulo" id="modalTitulo">Agregar actividad</div>

    <div class="form-grupo">
      <label>Fecha</label>
      <input type="text" id="modalFecha" disabled>
    </div>

    <div class="form-grupo">
      <label>Turno</label>
      <select id="modalTurno">
        <option value="Matutino">Matutino</option>
        <option value="Vespertino">Vespertino</option>
        <option value="Nocturno">Nocturno</option>
      </select>
    </div>

    <div class="form-grupo">
      <label>Hora</label>
      <input type="time" id="modalHora">
    </div>

    <div class="form-grupo">
      <label>Nombre de la actividad</label>
      <input type="text" id="modalNombre" placeholder="Escribir actividad">
    </div>

    <div class="modal-botones">
      <button class="btn btn-cancelar" onclick="cerrarModal()">Cancelar</button>
      <button class="btn btn-green" onclick="guardarModal()">Guardar</button>
    </div>
  </div>
</div>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>

<script>
const firebaseConfig = {
  apiKey: "AIzaSyAUbSmA64Kj6326H8-FJqSFDyb1Zzardj8",
  authDomain: "calendario-actividades-76382.firebaseapp.com",
  databaseURL: "https://calendario-actividades-76382-default-rtdb.firebaseio.com",
  projectId: "calendario-actividades-76382",
  storageBucket: "calendario-actividades-76382.firebasestorage.app",
  messagingSenderId: "455833092742",
  appId: "1:455833092742:web:eafb4950d8de8409b80707",
  measurementId: "G-YWQ92KPD0T"
};

firebase.initializeApp(firebaseConfig);
const database = firebase.database();

const nombresMes = [
  "Enero","Febrero","Marzo","Abril","Mayo","Junio",
  "Julio","Agosto","Setiembre","Octubre","Noviembre","Diciembre"
];

const turnos = ["Matutino", "Vespertino", "Nocturno"];

const ordenTurnos = {
  "Matutino": 1,
  "Vespertino": 2,
  "Nocturno": 3
};

const mesSelect = document.getElementById("mes");
const anioInput = document.getElementById("anio");
const buscador = document.getElementById("buscador");
const gridCalendario = document.getElementById("gridCalendario");
const btnAnteriores = document.getElementById("btnAnteriores");
const panelReporte = document.getElementById("panelReporte");
const btnReporte = document.getElementById("btnReporte");
const reporteLista = document.getElementById("reporteLista");

const modalEvento = document.getElementById("modalEvento");
const modalTitulo = document.getElementById("modalTitulo");
const modalFecha = document.getElementById("modalFecha");
const modalTurno = document.getElementById("modalTurno");
const modalHora = document.getElementById("modalHora");
const modalNombre = document.getElementById("modalNombre");

let datosFirebase = {};
let mostrarAnteriores = false;
let reporteVisible = false;
let modoModal = "agregar";
let eventoEditando = null;

const hoy = new Date();
const hoyDia = hoy.getDate();
const hoyMes = hoy.getMonth();
const hoyAnio = hoy.getFullYear();

for(let i=0;i<12;i++){
  const op = document.createElement("option");
  op.value = i;
  op.textContent = nombresMes[i];
  mesSelect.appendChild(op);
}

mesSelect.value = hoyMes;
anioInput.value = hoyAnio;

function keyDia(anio, mes, dia, turno){
  return `calendario_${anio}_${mes + 1}_${dia}_${turno}`;
}

function obtenerEventos(key){
  return datosFirebase[key] || [];
}

function ordenarEventos(a,b){
  const turnoA = ordenTurnos[a.turno] || 99;
  const turnoB = ordenTurnos[b.turno] || 99;

  if(turnoA !== turnoB){
    return turnoA - turnoB;
  }

  const horaA = a.hora || "99:99";
  const horaB = b.hora || "99:99";

  return horaA.localeCompare(horaB);
}

database.ref("actividades").on("value", function(snapshot){
  datosFirebase = snapshot.val() || {};
  generarCalendario();
});

function cambioMesAnio(){
  generarCalendario();
}

function generarCalendario(){
  const mes = parseInt(mesSelect.value);
  const anio = parseInt(anioInput.value);
  const totalDias = new Date(anio, mes + 1, 0).getDate();
  const textoBusqueda = buscador.value.toLowerCase().trim();

  let html = "";

  for(let dia=1; dia<=totalDias; dia++){
    const esMesActual = anio === hoyAnio && mes === hoyMes;
    const esDiaPasado = esMesActual && dia < hoyDia;
    const esHoy = esMesActual && dia === hoyDia;

    if(esDiaPasado && !mostrarAnteriores){
      continue;
    }

    let eventosDia = obtenerEventosDelDia(anio, mes, dia);

    if(textoBusqueda !== ""){
      eventosDia = eventosDia.filter(ev =>
        ev.nombre.toLowerCase().includes(textoBusqueda) ||
        ev.hora.toLowerCase().includes(textoBusqueda) ||
        ev.turno.toLowerCase().includes(textoBusqueda)
      );

      if(eventosDia.length === 0){
        continue;
      }
    }

    html += `
      <div class="dia-card ${esHoy ? "hoy-card" : ""}">
        <div class="dia-header">
          <div class="dia-numero">${dia}/${mes + 1}/${anio}</div>
          <button class="btn-mas" onclick="abrirAgregar(${anio}, ${mes}, ${dia})">+</button>
        </div>
    `;

    if(eventosDia.length === 0){
      html += `<div class="sin-actividad-card">Sin actividades</div>`;
    }else{
      eventosDia.forEach(ev => {
        html += `
          <div class="evento-card">
            <div class="evento-top">
              <div class="evento-turno">${escapeHtml(ev.turno)}</div>

              <select class="evento-acciones" onchange="accionEvento(this, '${ev.key}', ${ev.index}, ${anio}, ${mes}, ${dia})">
                <option value="">Opciones</option>
                <option value="editar">Editar</option>
                <option value="quitar">Quitar</option>
              </select>
            </div>

            <div class="evento-hora-grande">${escapeHtml(ev.hora || "Sin hora")}</div>
            <div class="evento-nombre">${escapeHtml(ev.nombre || "Sin nombre")}</div>
          </div>
        `;
      });
    }

    html += `</div>`;
  }

  gridCalendario.innerHTML = html;
}

function obtenerEventosDelDia(anio, mes, dia){
  let eventosDia = [];

  turnos.forEach(turno => {
    const key = keyDia(anio, mes, dia, turno);
    const eventos = obtenerEventos(key);

    eventos.forEach((ev, index) => {
      if((ev.nombre || "").trim() !== "" || (ev.hora || "").trim() !== ""){
        eventosDia.push({
          key,
          index,
          turno,
          hora: ev.hora || "",
          nombre: ev.nombre || ""
        });
      }
    });
  });

  eventosDia.sort(ordenarEventos);
  return eventosDia;
}

function abrirAgregar(anio, mes, dia){
  modoModal = "agregar";
  eventoEditando = {anio, mes, dia};

  modalTitulo.textContent = "Agregar actividad";
  modalFecha.value = `${dia}/${mes + 1}/${anio}`;
  modalTurno.value = "Matutino";
  modalHora.value = "";
  modalNombre.value = "";

  modalEvento.style.display = "flex";
}

function abrirEditar(key, index, anio, mes, dia){
  const eventos = obtenerEventos(key);
  const evento = eventos[index];

  if(!evento){
    return;
  }

  const turnoActual = key.split("_").pop();

  modoModal = "editar";
  eventoEditando = {key, index, anio, mes, dia, turnoActual};

  modalTitulo.textContent = "Editar actividad";
  modalFecha.value = `${dia}/${mes + 1}/${anio}`;
  modalTurno.value = turnoActual;
  modalHora.value = evento.hora || "";
  modalNombre.value = evento.nombre || "";

  modalEvento.style.display = "flex";
}

function cerrarModal(){
  modalEvento.style.display = "none";
}

function guardarModal(){
  const turno = modalTurno.value;
  const hora = modalHora.value;
  const nombre = modalNombre.value.trim();

  if(nombre === "" && hora === ""){
    alert("Debe ingresar al menos una hora o un nombre de actividad.");
    return;
  }

  if(modoModal === "agregar"){
    const {anio, mes, dia} = eventoEditando;
    const key = keyDia(anio, mes, dia, turno);
    const eventos = obtenerEventos(key);

    eventos.push({hora, nombre});
    datosFirebase[key] = eventos;

    database.ref("actividades/" + key).set(eventos).then(() => {
      cerrarModal();
      generarCalendario();
    });
  }

  if(modoModal === "editar"){
    const {key, index, anio, mes, dia, turnoActual} = eventoEditando;

    const eventosViejos = obtenerEventos(key);

    if(!eventosViejos[index]){
      return;
    }

    eventosViejos.splice(index, 1);

    const keyNueva = keyDia(anio, mes, dia, turno);
    const eventosNuevos = obtenerEventos(keyNueva);

    eventosNuevos.push({hora, nombre});

    datosFirebase[key] = eventosViejos;
    datosFirebase[keyNueva] = eventosNuevos;

    Promise.all([
      database.ref("actividades/" + key).set(eventosViejos),
      database.ref("actividades/" + keyNueva).set(eventosNuevos)
    ]).then(() => {
      cerrarModal();
      generarCalendario();
    });
  }
}

function accionEvento(select, key, index, anio, mes, dia){
  const accion = select.value;

  if(accion === "editar"){
    abrirEditar(key, index, anio, mes, dia);
  }

  if(accion === "quitar"){
    eliminarEvento(key, index);
  }

  select.value = "";
}

function eliminarEvento(key, index){
  if(!confirm("¿Seguro que desea quitar esta actividad?")){
    return;
  }

  const eventos = obtenerEventos(key);
  eventos.splice(index, 1);
  datosFirebase[key] = eventos;

  database.ref("actividades/" + key).set(eventos).then(() => {
    generarCalendario();
  });
}

function alternarAnteriores(){
  mostrarAnteriores = !mostrarAnteriores;
  btnAnteriores.textContent = mostrarAnteriores ? "Ocultar días anteriores" : "Ver días anteriores";
  generarCalendario();
}

function alternarReporte(){
  reporteVisible = !reporteVisible;
  panelReporte.style.display = reporteVisible ? "block" : "none";
  btnReporte.textContent = reporteVisible ? "Ocultar reporte" : "Reporte de actividades";

  if(reporteVisible){
    completarFechasReporte();
    generarReporte();
  }
}

function completarFechasReporte(){
  const mes = parseInt(mesSelect.value);
  const anio = parseInt(anioInput.value);
  const totalDias = new Date(anio, mes + 1, 0).getDate();

  document.getElementById("fechaDesde").value = `${anio}-${String(mes + 1).padStart(2,"0")}-01`;
  document.getElementById("fechaHasta").value = `${anio}-${String(mes + 1).padStart(2,"0")}-${String(totalDias).padStart(2,"0")}`;
}

function generarReporte(){
  const desde = document.getElementById("fechaDesde").value;
  const hasta = document.getElementById("fechaHasta").value;

  if(!desde || !hasta){
    reporteLista.innerHTML = "Debe seleccionar fecha desde y fecha hasta.";
    return;
  }

  const fechaDesde = new Date(desde + "T00:00:00");
  const fechaHasta = new Date(hasta + "T23:59:59");

  if(fechaDesde > fechaHasta){
    reporteLista.innerHTML = "La fecha desde no puede ser mayor que la fecha hasta.";
    return;
  }

  let html = `
    <h2>Reporte de actividades</h2>
    <p><strong>Desde:</strong> ${formatearFecha(fechaDesde)} &nbsp; <strong>Hasta:</strong> ${formatearFecha(fechaHasta)}</p>
  `;

  let cantidad = 0;

  const fechaActual = new Date(fechaDesde);

  while(fechaActual <= fechaHasta){
    const anio = fechaActual.getFullYear();
    const mes = fechaActual.getMonth();
    const dia = fechaActual.getDate();

    const eventos = obtenerEventosDelDia(anio, mes, dia);

    if(eventos.length > 0){
      html += `<div class="reporte-item">`;
      html += `<div class="reporte-fecha">${dia}/${mes + 1}/${anio}</div>`;

      eventos.forEach(ev => {
        cantidad++;
        html += `
          <div class="reporte-actividad">
            <strong>${escapeHtml(ev.turno)}</strong> -
            ${escapeHtml(ev.hora || "Sin hora")} -
            ${escapeHtml(ev.nombre || "Sin nombre")}
          </div>
        `;
      });

      html += `</div>`;
    }

    fechaActual.setDate(fechaActual.getDate() + 1);
  }

  if(cantidad === 0){
    html += `<p>No hay actividades cargadas en el rango seleccionado.</p>`;
  }

  reporteLista.innerHTML = html;
}

function buscarEventos(){
  generarCalendario();
}

function formatearFecha(fecha){
  return `${fecha.getDate()}/${fecha.getMonth() + 1}/${fecha.getFullYear()}`;
}

function escapeHtml(text){
  return String(text || "")
    .replaceAll("&","&amp;")
    .replaceAll("<","&lt;")
    .replaceAll(">","&gt;")
    .replaceAll('"',"&quot;");
}

window.onclick = function(event){
  if(event.target === modalEvento){
    cerrarModal();
  }
}

generarCalendario();
</script>

</body>
</html>
