<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Calendario mensual de actividades</title>
<meta name="viewport" content="width=device-width, initial-scale=1">

<style>
*{box-sizing:border-box}

body{
  margin:0;
  font-family:'Segoe UI',sans-serif;
  background:linear-gradient(to bottom right,#cceeff,#99ccff);
  padding:14px;
  color:#003b57;
}

.wrap{
  max-width:1300px;
  margin:0 auto;
  background:#fff;
  border-radius:18px;
  box-shadow:0 0 12px rgba(0,0,0,.12);
  overflow:hidden;
}

.top{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:12px;
  padding:14px 16px;
  border-bottom:3px solid #0099cc;
  flex-wrap:wrap;
}

.title{
  font-size:22px;
  font-weight:800;
  color:#004466;
}

.controls{
  display:flex;
  gap:8px;
  align-items:center;
  flex-wrap:wrap;
}

select,input{
  padding:8px;
  border-radius:8px;
  border:1px solid #9ed8ef;
  font-size:14px;
}

.btn{
  border:none;
  background:#0099cc;
  color:white;
  padding:8px 11px;
  border-radius:9px;
  cursor:pointer;
  font-weight:700;
}

.btn:hover{background:#007faa}

.btn-green{background:#00a86b}
.btn-green:hover{background:#008e5b}

.btn-red{background:#d9534f}
.btn-red:hover{background:#c9302c}

.aviso{
  padding:10px 16px;
  font-size:13px;
  background:#f1fbff;
  border-bottom:1px solid #cdefff;
}

.table-wrap{overflow-x:auto}

table{
  width:100%;
  border-collapse:collapse;
  min-width:950px;
}

th{
  background:#e9f7ff;
  padding:10px;
  border-bottom:2px solid #bfe7ff;
  font-weight:800;
  color:#003d5a;
}

td{
  border-bottom:1px solid #e6f2fa;
  padding:8px;
  vertical-align:top;
}

.col-fecha{
  width:120px;
  font-weight:800;
  text-align:center;
  background:#fbfdff;
  white-space:nowrap;
}

.fila-hoy{
  background:#fffbea;
  outline:4px solid #e6c800;
  outline-offset:-4px;
}

.dia-box{
  min-height:120px;
  background:#f8fcff;
  border:1px solid #d7edf8;
  border-radius:12px;
  padding:8px;
}

.evento{
  background:white;
  border-left:5px solid #0099cc;
  border-radius:9px;
  padding:7px;
  margin-bottom:7px;
  box-shadow:0 1px 4px rgba(0,0,0,.08);
}

.evento input{
  width:100%;
  margin-bottom:5px;
}

.evento-grid{
  display:grid;
  grid-template-columns:90px 1fr;
  gap:6px;
}

.evento-acciones{
  display:flex;
  gap:5px;
  justify-content:flex-end;
  flex-wrap:wrap;
}

.btn-mini{
  border:none;
  padding:5px 8px;
  border-radius:7px;
  cursor:pointer;
  font-size:12px;
  font-weight:700;
  background:#0099cc;
  color:white;
}

.btn-mini-red{
  background:#d9534f;
}

.sin-eventos{
  font-size:12px;
  color:#6b8794;
  text-align:center;
  margin:8px 0;
}

.oculto{display:none}

@media(max-width:700px){
  body{padding:8px}
  .title{font-size:18px}
  table{min-width:850px}
}
</style>
</head>

<body>

<div class="wrap">

  <div class="top">
    <div class="title">Calendario mensual de actividades</div>

    <div class="controls">
      <label>Mes:</label>
      <select id="mes" onchange="generarCalendario()"></select>

      <label>Año:</label>
      <input type="number" id="anio" min="2020" max="2100" onchange="generarCalendario()">

      <button class="btn btn-green" onclick="cargarDesdeJSON()">Cargar actividades</button>
      <button class="btn" onclick="alternarAnteriores()" id="btnAnteriores">Ver días anteriores</button>
      <button class="btn btn-green" onclick="agregarEventoNuevo()">Agregar evento</button>
      <button class="btn btn-red" onclick="descargarJSON()">Descargar actividades.json</button>

      <input type="text" id="buscador" placeholder="Buscar evento..." oninput="generarCalendario()">
    </div>
  </div>

  <div class="aviso">
    Este calendario lee el archivo <b>actividades.json</b>. Para que los cambios se vean en todas las computadoras,
    descargá el JSON actualizado y subilo nuevamente a GitHub reemplazando el archivo anterior.
  </div>

  <div class="table-wrap">
    <table id="tabla"></table>
  </div>

</div>

<script>
const URL_JSON = "actividades.json";

const nombresMes = [
  "Enero","Febrero","Marzo","Abril","Mayo","Junio",
  "Julio","Agosto","Setiembre","Octubre","Noviembre","Diciembre"
];

const mesSelect = document.getElementById("mes");
const anioInput = document.getElementById("anio");
const tabla = document.getElementById("tabla");
const btnAnteriores = document.getElementById("btnAnteriores");
const buscador = document.getElementById("buscador");

let actividades = [];
let mostrarAnteriores = false;

const hoy = new Date();
const hoyDia = hoy.getDate();
const hoyMes = hoy.getMonth();
const hoyAnio = hoy.getFullYear();

for(let i=0;i<12;i++){
  const op = document.createElement("option");
  op.value = i;
  op.textContent = nombresMes[i];
  mesSelect.appendChild(op);
}

mesSelect.value = hoyMes;
anioInput.value = hoyAnio;

async function cargarDesdeJSON(){
  try{
    const respuesta = await fetch(URL_JSON + "?v=" + new Date().getTime());

    if(!respuesta.ok){
      throw new Error("No se pudo cargar actividades.json");
    }

    actividades = await respuesta.json();

    if(!Array.isArray(actividades)){
      actividades = [];
      alert("El archivo actividades.json no tiene formato de lista.");
    }

    guardarTemporal();
    generarCalendario();

  }catch(error){
    const guardado = localStorage.getItem("actividades_temporal");

    if(guardado){
      actividades = JSON.parse(guardado);
      generarCalendario();
      alert("No se pudo cargar el JSON online. Se cargó la última versión guardada en este navegador.");
    }else{
      actividades = [];
      generarCalendario();
      alert("No se encontró actividades.json. Se inicia vacío.");
    }
  }
}

function guardarTemporal(){
  localStorage.setItem("actividades_temporal", JSON.stringify(actividades));
}

function fechaISO(anio, mes, dia){
  const m = String(mes + 1).padStart(2, "0");
  const d = String(dia).padStart(2, "0");
  return `${anio}-${m}-${d}`;
}

function fechaMostrar(iso){
  const partes = iso.split("-");
  return `${partes[2]}/${partes[1]}/${partes[0]}`;
}

function obtenerActividadesPorFecha(fecha){
  return actividades
    .map((act, index) => ({...act, indexOriginal:index}))
    .filter(act => act.fecha === fecha)
    .sort((a,b) => (a.hora || "99:99").localeCompare(b.hora || "99:99"));
}

function generarCalendario(){
  const mes = parseInt(mesSelect.value);
  const anio = parseInt(anioInput.value);
  const totalDias = new Date(anio, mes + 1, 0).getDate();
  const texto = buscador.value.toLowerCase().trim();

  let html = `
    <tr>
      <th class="col-fecha">Fecha</th>
      <th>Actividades</th>
    </tr>
  `;

  for(let dia=1; dia<=totalDias; dia++){
    const esMesActual = anio === hoyAnio && mes === hoyMes;
    const esDiaPasado = esMesActual && dia < hoyDia;
    const esHoy = esMesActual && dia === hoyDia;

    if(esDiaPasado && !mostrarAnteriores){
      continue;
    }

    const fecha = fechaISO(anio, mes, dia);
    let eventos = obtenerActividadesPorFecha(fecha);

    if(texto !== ""){
      eventos = eventos.filter(ev =>
        String(ev.nombre || "").toLowerCase().includes(texto) ||
        String(ev.hora || "").toLowerCase().includes(texto) ||
        String(ev.fecha || "").toLowerCase().includes(texto)
      );

      if(eventos.length === 0){
        continue;
      }
    }

    html += `
      <tr class="${esHoy ? "fila-hoy" : ""}">
        <td class="col-fecha">${dia}/${mes + 1}/${anio}</td>
        <td>
          <div class="dia-box">
    `;

    if(eventos.length === 0){
      html += `<div class="sin-eventos">Sin actividades</div>`;
    }

    eventos.forEach(ev => {
      html += crearEventoHTML(ev);
    });

    html += `
            <button class="btn-mini" onclick="agregarEventoEnFecha('${fecha}')">Agregar en este día</button>
          </div>
        </td>
      </tr>
    `;
  }

  tabla.innerHTML = html;
}

function crearEventoHTML(ev){
  const i = ev.indexOriginal;

  return `
    <div class="evento">
      <div class="evento-grid">
        <input type="time" value="${escapeHtml(ev.hora || "")}" onchange="actualizarEvento(${i}, 'hora', this.value)">
        <input type="text" value="${escapeHtml(ev.nombre || "")}" placeholder="Nombre de la actividad" onchange="actualizarEvento(${i}, 'nombre', this.value)">
      </div>

      <div class="evento-grid">
        <input type="date" value="${escapeHtml(ev.fecha || "")}" onchange="actualizarEvento(${i}, 'fecha', this.value)">
        <input type="text" value="${escapeHtml(ev.descripcion || "")}" placeholder="Descripción opcional" onchange="actualizarEvento(${i}, 'descripcion', this.value)">
      </div>

      <div class="evento-acciones">
        <button class="btn-mini" onclick="moverEvento(${i}, -1)">Mover día anterior</button>
        <button class="btn-mini" onclick="moverEvento(${i}, 1)">Mover día siguiente</button>
        <button class="btn-mini btn-mini-red" onclick="eliminarEvento(${i})">Eliminar</button>
      </div>
    </div>
  `;
}

function agregarEventoNuevo(){
  const mes = parseInt(mesSelect.value);
  const anio = parseInt(anioInput.value);
  const fecha = fechaISO(anio, mes, hoyDia);

  actividades.push({
    fecha: fecha,
    hora: "",
    nombre: "",
    descripcion: ""
  });

  guardarTemporal();
  generarCalendario();
}

function agregarEventoEnFecha(fecha){
  actividades.push({
    fecha: fecha,
    hora: "",
    nombre: "",
    descripcion: ""
  });

  guardarTemporal();
  generarCalendario();
}

function actualizarEvento(index, campo, valor){
  actividades[index][campo] = valor;
  guardarTemporal();
  generarCalendario();
}

function moverEvento(index, dias){
  const fechaActual = new Date(actividades[index].fecha + "T00:00:00");
  fechaActual.setDate(fechaActual.getDate() + dias);

  const anio = fechaActual.getFullYear();
  const mes = String(fechaActual.getMonth() + 1).padStart(2, "0");
  const dia = String(fechaActual.getDate()).padStart(2, "0");

  actividades[index].fecha = `${anio}-${mes}-${dia}`;

  guardarTemporal();
  generarCalendario();
}

function eliminarEvento(index){
  if(confirm("¿Eliminar esta actividad?")){
    actividades.splice(index, 1);
    guardarTemporal();
    generarCalendario();
  }
}

function alternarAnteriores(){
  mostrarAnteriores = !mostrarAnteriores;
  btnAnteriores.textContent = mostrarAnteriores ? "Ocultar días anteriores" : "Ver días anteriores";
  generarCalendario();
}

function descargarJSON(){
  const json = JSON.stringify(actividades, null, 2);
  const blob = new Blob([json], {type:"application/json"});
  const url = URL.createObjectURL(blob);

  const a = document.createElement("a");
  a.href = url;
  a.download = "actividades.json";
  a.click();

  URL.revokeObjectURL(url);
}

function escapeHtml(text){
  return String(text || "")
    .replaceAll("&","&amp;")
    .replaceAll("<","&lt;")
    .replaceAll(">","&gt;")
    .replaceAll('"',"&quot;");
}

cargarDesdeJSON();
</script>

</body>
</html>
