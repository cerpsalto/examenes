<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Calendario mensual de actividades</title>
<meta name="viewport" content="width=device-width, initial-scale=1">

<style>
*{box-sizing:border-box}

body{
  margin:0;
  font-family:'Segoe UI',sans-serif;
  background:linear-gradient(to bottom right,#cceeff,#99ccff);
  padding:12px;
  color:#003b57;
}

.wrap{
  max-width:1300px;
  margin:0 auto;
  background:#fff;
  border-radius:18px;
  box-shadow:0 0 12px rgba(0,0,0,.12);
  overflow:hidden;
}

.top{
  padding:14px 16px;
  border-bottom:3px solid #0099cc;
}

.encabezado{
  display:flex;
  align-items:center;
  justify-content:center;
  gap:12px;
  margin-bottom:12px;
}

.logo-principal{
  width:42px;
  height:42px;
  object-fit:contain;
}

.title{
  font-size:22px;
  font-weight:800;
  color:#004466;
}

.controls{
  display:flex;
  gap:8px;
  align-items:center;
  flex-wrap:wrap;
  justify-content:center;
}

select,input{
  padding:8px;
  border-radius:8px;
  border:1px solid #9ed8ef;
  font-size:14px;
}

.btn{
  border:none;
  background:#0099cc;
  color:white;
  padding:8px 11px;
  border-radius:9px;
  cursor:pointer;
  font-weight:700;
}

.btn:hover{background:#007faa}

.btn-green{background:#00a86b}
.btn-green:hover{background:#008e5b}

.btn-red{background:#d9534f}
.btn-red:hover{background:#c9302c}

.btn-small{
  border:none;
  background:#00a86b;
  color:white;
  padding:7px 12px;
  border-radius:8px;
  cursor:pointer;
  font-size:13px;
  font-weight:900;
}

.btn-minus{
  border:none;
  background:#d9534f;
  color:white;
  padding:7px 12px;
  border-radius:8px;
  cursor:pointer;
  font-size:15px;
  font-weight:900;
}

.vista-grafica{
  padding:16px;
}

.grid-calendario{
  display:grid;
  grid-template-columns:repeat(auto-fill,minmax(230px,1fr));
  gap:12px;
}

.dia-card{
  border:2px solid #d7edf8;
  border-radius:14px;
  background:#f8fcff;
  padding:10px;
  min-height:150px;
}

.dia-card.hoy-card{
  border-color:#e6c800;
  background:#fffbea;
}

.dia-numero{
  font-size:18px;
  font-weight:900;
  color:#004466;
  margin-bottom:8px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:8px;
}

.fecha-con-logo{
  display:flex;
  align-items:center;
  gap:7px;
}

.logo-dia{
  width:25px;
  height:25px;
  object-fit:contain;
}

.evento-card{
  background:white;
  border-left:5px solid #0099cc;
  border-radius:8px;
  padding:8px;
  margin-bottom:8px;
  box-shadow:0 1px 4px rgba(0,0,0,.08);
}

.evento-header{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:8px;
}

.evento-turno{
  font-size:13px;
  font-weight:900;
  color:#004466;
}

.evento-hora-grande{
  font-size:19px;
  font-weight:900;
  color:#007faa;
  margin:3px 0;
}

.evento-nombre{
  font-size:14px;
  font-weight:700;
  margin-bottom:7px;
}

.acciones-evento{
  display:none;
  gap:6px;
  margin-top:8px;
}

.acciones-evento.activo{
  display:flex;
}

.acciones-evento button{
  flex:1;
}

.sin-actividad-card{
  color:#7b929c;
  font-size:13px;
  text-align:center;
  margin:24px 0;
}

.panel-reporte{
  display:none;
  padding:12px 16px;
  background:#f1fbff;
  border-bottom:2px solid #cdefff;
}

.panel-reporte .controls{
  justify-content:center;
}

.reporte{
  display:none;
  padding:16px;
  border-top:2px solid #cdefff;
}

.reporte h2{
  color:#004466;
  text-align:center;
}

.reporte-item{
  background:#f8fcff;
  border:1px solid #d7edf8;
  border-radius:10px;
  padding:10px;
  margin-bottom:8px;
}

.reporte-fecha{
  font-weight:900;
  color:#004466;
}

.modal-fondo{
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.45);
  display:none;
  align-items:center;
  justify-content:center;
  padding:15px;
  z-index:1000;
}

.modal{
  background:white;
  border-radius:16px;
  padding:18px;
  width:100%;
  max-width:420px;
  box-shadow:0 0 18px rgba(0,0,0,.25);
}

.modal h2{
  margin-top:0;
  color:#004466;
  text-align:center;
}

.modal label{
  display:block;
  font-weight:800;
  margin-top:10px;
}

.modal input,
.modal select{
  width:100%;
  padding:10px;
  font-size:16px;
  margin-top:5px;
}

.modal-actions{
  display:flex;
  gap:8px;
  margin-top:16px;
}

.modal-actions button{
  flex:1;
}

@media(max-width:700px){
  body{padding:6px}
  .wrap{border-radius:12px}
  .top{padding:12px}

  .encabezado{
    flex-direction:column;
    gap:5px;
  }

  .logo-principal{
    width:38px;
    height:38px;
  }

  .title{
    font-size:20px;
    text-align:center;
  }

  .controls{
    flex-direction:column;
    align-items:stretch;
  }

  .controls label{
    font-weight:700;
  }

  .controls select,
  .controls input,
  .btn{
    width:100%;
    font-size:16px;
    padding:12px;
  }

  .grid-calendario{
    grid-template-columns:1fr;
  }

  .dia-numero{
    font-size:22px;
  }

  .evento-hora-grande{
    font-size:24px;
  }

  .evento-nombre{
    font-size:17px;
  }

  .btn-small,
  .btn-minus{
    padding:11px 14px;
    font-size:18px;
  }

  .acciones-evento{
    flex-direction:column;
  }

  .acciones-evento button{
    width:100%;
    padding:11px;
    font-size:16px;
  }

  .modal-actions{
    flex-direction:column;
  }
}
</style>
</head>

<body>

<div class="wrap">

  <div class="top">
    <div class="encabezado">
      <img src="dia.png" class="logo-principal" alt="Logo">
      <div class="title">Calendario mensual de actividades</div>
    </div>

    <div class="controls">
      <label>Mes:</label>
      <select id="mes" onchange="generarCalendario()"></select>

      <label>Año:</label>
      <input type="number" id="anio" min="2020" max="2100" onchange="generarCalendario()">

      <button class="btn" onclick="alternarAnteriores()" id="btnAnteriores">Ver días anteriores</button>

      <input type="text" id="buscador" placeholder="Buscar actividad..." oninput="generarCalendario()">

      <button class="btn btn-green" onclick="mostrarPanelReporte()">Generar reporte</button>
    </div>
  </div>

  <div class="panel-reporte" id="panelReporte">
    <div class="controls">
      <label>Desde:</label>
      <input type="date" id="fechaDesde">

      <label>Hasta:</label>
      <input type="date" id="fechaHasta">

      <button class="btn btn-green" onclick="generarReporte()">Ver reporte</button>
      <button class="btn btn-red" onclick="cerrarReporte()">Cerrar</button>
    </div>
  </div>

  <div class="vista-grafica">
    <div class="grid-calendario" id="gridCalendario"></div>
  </div>

  <div class="reporte" id="reporte"></div>

</div>

<div class="modal-fondo" id="modalFondo">
  <div class="modal">
    <h2 id="tituloModal">Agregar actividad</h2>

    <label>Turno</label>
    <select id="modalTurno" onchange="actualizarLimiteHora()">
      <option value="Matutino">Matutino</option>
      <option value="Vespertino">Vespertino</option>
      <option value="Nocturno">Nocturno</option>
    </select>

    <label>Hora</label>
    <input type="time" id="modalHora">

    <label>Actividad</label>
    <input type="text" id="modalNombre" placeholder="Nombre de la actividad">

    <div class="modal-actions">
      <button class="btn btn-green" onclick="guardarDesdeModal()">Guardar</button>
      <button class="btn btn-red" onclick="cerrarModal()">Cancelar</button>
    </div>
  </div>
</div>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>

<script>
const firebaseConfig = {
  apiKey: "AIzaSyAUbSmA64Kj6326H8-FJqSFDyb1Zzardj8",
  authDomain: "calendario-actividades-76382.firebaseapp.com",
  databaseURL: "https://calendario-actividades-76382-default-rtdb.firebaseio.com",
  projectId: "calendario-actividades-76382",
  storageBucket: "calendario-actividades-76382.firebasestorage.app",
  messagingSenderId: "455833092742",
  appId: "1:455833092742:web:eafb4950d8de8409b80707",
  measurementId: "G-YWQ92KPD0T"
};

firebase.initializeApp(firebaseConfig);
const database = firebase.database();

const nombresMes = [
  "Enero","Febrero","Marzo","Abril","Mayo","Junio",
  "Julio","Agosto","Setiembre","Octubre","Noviembre","Diciembre"
];

const turnos = ["Matutino", "Vespertino", "Nocturno"];

const ordenTurnos = {
  "Matutino": 1,
  "Vespertino": 2,
  "Nocturno": 3
};

const limitesHora = {
  "Matutino": {min:"07:00", max:"14:00"},
  "Vespertino": {min:"14:00", max:"20:00"},
  "Nocturno": {min:"18:00", max:"23:00"}
};

const mesSelect = document.getElementById("mes");
const anioInput = document.getElementById("anio");
const gridCalendario = document.getElementById("gridCalendario");
const buscador = document.getElementById("buscador");
const btnAnteriores = document.getElementById("btnAnteriores");

const modalFondo = document.getElementById("modalFondo");
const tituloModal = document.getElementById("tituloModal");
const modalTurno = document.getElementById("modalTurno");
const modalHora = document.getElementById("modalHora");
const modalNombre = document.getElementById("modalNombre");

let datosFirebase = {};
let mostrarAnteriores = false;

let modalModo = "agregar";
let modalAnio = null;
let modalMes = null;
let modalDia = null;
let modalKey = null;
let modalIndex = null;

const hoy = new Date();
const hoyDia = hoy.getDate();
const hoyMes = hoy.getMonth();
const hoyAnio = hoy.getFullYear();

for(let i=0;i<12;i++){
  const op = document.createElement("option");
  op.value = i;
  op.textContent = nombresMes[i];
  mesSelect.appendChild(op);
}

mesSelect.value = hoyMes;
anioInput.value = hoyAnio;

function keyDia(anio, mes, dia, turno){
  return `calendario_${anio}_${mes + 1}_${dia}_${turno}`;
}

function obtenerEventos(key){
  return datosFirebase[key] || [];
}

function ordenarEventos(a,b){
  const turnoA = ordenTurnos[a.turno] || 99;
  const turnoB = ordenTurnos[b.turno] || 99;

  if(turnoA !== turnoB){
    return turnoA - turnoB;
  }

  const horaA = a.hora || "99:99";
  const horaB = b.hora || "99:99";

  return horaA.localeCompare(horaB);
}

database.ref("actividades").on("value", function(snapshot){
  datosFirebase = snapshot.val() || {};
  generarCalendario();
});

function generarCalendario(){
  const mes = parseInt(mesSelect.value);
  const anio = parseInt(anioInput.value);
  const totalDias = new Date(anio, mes + 1, 0).getDate();
  const textoBusqueda = buscador.value.toLowerCase().trim();

  let html = "";

  for(let dia=1; dia<=totalDias; dia++){
    const esMesActual = anio === hoyAnio && mes === hoyMes;
    const esDiaPasado = esMesActual && dia < hoyDia;
    const esHoy = esMesActual && dia === hoyDia;

    if(esDiaPasado && !mostrarAnteriores){
      continue;
    }

    let eventosDia = [];

    turnos.forEach(turno => {
      const key = keyDia(anio, mes, dia, turno);
      const eventos = obtenerEventos(key);

      eventos.forEach((ev, index) => {
        if((ev.nombre || "").trim() !== "" || (ev.hora || "").trim() !== ""){
          eventosDia.push({
            key,
            index,
            turno,
            hora: ev.hora || "",
            nombre: ev.nombre || ""
          });
        }
      });
    });

    eventosDia.sort(ordenarEventos);

    let eventosFiltrados = eventosDia;

    if(textoBusqueda !== ""){
      eventosFiltrados = eventosDia.filter(ev =>
        ev.nombre.toLowerCase().includes(textoBusqueda) ||
        ev.hora.toLowerCase().includes(textoBusqueda) ||
        ev.turno.toLowerCase().includes(textoBusqueda)
      );

      if(eventosFiltrados.length === 0){
        continue;
      }
    }

    html += `
      <div class="dia-card ${esHoy ? "hoy-card" : ""}">
        <div class="dia-numero">
          <span class="fecha-con-logo">
            <img src="dia.png" class="logo-dia" alt="Día">
            <span>${dia}/${mes + 1}/${anio}</span>
          </span>
          <button class="btn-small" onclick="abrirAgregar(${anio}, ${mes}, ${dia})">+</button>
        </div>
    `;

    if(eventosFiltrados.length === 0){
      html += `<div class="sin-actividad-card">Sin actividades</div>`;
    }else{
      eventosFiltrados.forEach(ev => {
        const idAcciones = `acciones_${anio}_${mes}_${dia}_${ev.turno}_${ev.index}`;

        html += `
          <div class="evento-card">
            <div class="evento-header">
              <div class="evento-turno">${escapeHtml(ev.turno)}</div>
              <button class="btn-minus" onclick="mostrarAcciones('${idAcciones}')">-</button>
            </div>

            <div class="evento-hora-grande">${escapeHtml(ev.hora || "Sin hora")}</div>
            <div class="evento-nombre">${escapeHtml(ev.nombre || "Sin nombre")}</div>

            <div class="acciones-evento" id="${idAcciones}">
              <button class="btn" onclick="abrirEditar('${ev.key}', ${ev.index}, ${anio}, ${mes}, ${dia})">Editar</button>
              <button class="btn btn-red" onclick="eliminarEvento('${ev.key}', ${ev.index})">Quitar</button>
            </div>
          </div>
        `;
      });
    }

    html += `</div>`;
  }

  gridCalendario.innerHTML = html;
}

function mostrarAcciones(id){
  const panel = document.getElementById(id);
  if(panel){
    panel.classList.toggle("activo");
  }
}

function abrirAgregar(anio, mes, dia){
  modalModo = "agregar";
  modalAnio = anio;
  modalMes = mes;
  modalDia = dia;
  modalKey = null;
  modalIndex = null;

  tituloModal.textContent = "Agregar actividad";
  modalTurno.value = "Matutino";
  modalHora.value = "";
  modalNombre.value = "";
  actualizarLimiteHora();

  modalFondo.style.display = "flex";
}

function abrirEditar(key, index, anio, mes, dia){
  const eventos = obtenerEventos(key);
  const evento = eventos[index];

  if(!evento){
    return;
  }

  const partes = key.split("_");
  const turnoActual = partes[4];

  modalModo = "editar";
  modalAnio = anio;
  modalMes = mes;
  modalDia = dia;
  modalKey = key;
  modalIndex = index;

  tituloModal.textContent = "Editar actividad";
  modalTurno.value = turnoActual;
  modalHora.value = evento.hora || "";
  modalNombre.value = evento.nombre || "";
  actualizarLimiteHora();

  modalFondo.style.display = "flex";
}

function cerrarModal(){
  modalFondo.style.display = "none";
}

function actualizarLimiteHora(){
  const turno = modalTurno.value;
  modalHora.min = limitesHora[turno].min;
  modalHora.max = limitesHora[turno].max;

  if(modalHora.value){
    if(modalHora.value < modalHora.min || modalHora.value > modalHora.max){
      modalHora.value = "";
    }
  }
}

function guardarDesdeModal(){
  const turno = modalTurno.value;
  const hora = modalHora.value;
  const nombre = modalNombre.value.trim();

  if(!nombre){
    alert("Escriba el nombre de la actividad.");
    return;
  }

  if(!hora){
    alert("Seleccione una hora.");
    return;
  }

  if(hora < limitesHora[turno].min || hora > limitesHora[turno].max){
    alert("La hora seleccionada no corresponde al turno elegido.");
    return;
  }

  if(modalModo === "agregar"){
    const key = keyDia(modalAnio, modalMes, modalDia, turno);
    const eventos = obtenerEventos(key);

    eventos.push({hora, nombre});
    datosFirebase[key] = eventos;

    database.ref("actividades/" + key).set(eventos).then(() => {
      cerrarModal();
      generarCalendario();
    });
  }

  if(modalModo === "editar"){
    const keyNueva = keyDia(modalAnio, modalMes, modalDia, turno);
    const eventosViejos = obtenerEventos(modalKey);

    if(!eventosViejos[modalIndex]){
      cerrarModal();
      return;
    }

    eventosViejos.splice(modalIndex, 1);

    const eventosNuevos = obtenerEventos(keyNueva);
    eventosNuevos.push({hora, nombre});

    datosFirebase[modalKey] = eventosViejos;
    datosFirebase[keyNueva] = eventosNuevos;

    Promise.all([
      database.ref("actividades/" + modalKey).set(eventosViejos),
      database.ref("actividades/" + keyNueva).set(eventosNuevos)
    ]).then(() => {
      cerrarModal();
      generarCalendario();
    });
  }
}

function eliminarEvento(key, index){
  if(!confirm("¿Quitar esta actividad?")){
    return;
  }

  const eventos = obtenerEventos(key);
  eventos.splice(index, 1);
  datosFirebase[key] = eventos;

  database.ref("actividades/" + key).set(eventos).then(() => {
    generarCalendario();
  });
}

function alternarAnteriores(){
  mostrarAnteriores = !mostrarAnteriores;
  btnAnteriores.textContent = mostrarAnteriores ? "Ocultar días anteriores" : "Ver días anteriores";
  generarCalendario();
}

function mostrarPanelReporte(){
  const panel = document.getElementById("panelReporte");
  panel.style.display = panel.style.display === "block" ? "none" : "block";
}

function cerrarReporte(){
  document.getElementById("panelReporte").style.display = "none";
  document.getElementById("reporte").style.display = "none";
}

function generarReporte(){
  const desde = document.getElementById("fechaDesde").value;
  const hasta = document.getElementById("fechaHasta").value;
  const reporte = document.getElementById("reporte");

  if(!desde || !hasta){
    alert("Seleccione fecha desde y fecha hasta.");
    return;
  }

  if(desde > hasta){
    alert("La fecha desde no puede ser posterior a la fecha hasta.");
    return;
  }

  let fechaActual = new Date(desde + "T00:00:00");
  const fechaFinal = new Date(hasta + "T00:00:00");

  let items = [];

  while(fechaActual <= fechaFinal){
    const anio = fechaActual.getFullYear();
    const mes = fechaActual.getMonth();
    const dia = fechaActual.getDate();

    let eventosDia = [];

    turnos.forEach(turno => {
      const key = keyDia(anio, mes, dia, turno);
      const eventos = obtenerEventos(key);

      eventos.forEach(ev => {
        if((ev.nombre || "").trim() !== "" || (ev.hora || "").trim() !== ""){
          eventosDia.push({
            turno,
            hora: ev.hora || "",
            nombre: ev.nombre || ""
          });
        }
      });
    });

    eventosDia.sort(ordenarEventos);

    eventosDia.forEach(ev => {
      items.push({
        fecha: `${dia}/${mes + 1}/${anio}`,
        turno: ev.turno,
        hora: ev.hora || "Sin hora",
        nombre: ev.nombre || "Sin nombre"
      });
    });

    fechaActual.setDate(fechaActual.getDate() + 1);
  }

  let html = `
    <h2>Reporte de actividades</h2>
    <p><strong>Desde:</strong> ${formatearFechaInput(desde)}
    &nbsp; <strong>Hasta:</strong> ${formatearFechaInput(hasta)}</p>
  `;

  if(items.length === 0){
    html += `<p>No hay actividades cargadas en el rango seleccionado.</p>`;
  }else{
    items.forEach(item => {
      html += `
        <div class="reporte-item">
          <div class="reporte-fecha">${escapeHtml(item.fecha)}</div>
          <div><strong>Turno:</strong> ${escapeHtml(item.turno)}</div>
          <div><strong>Hora:</strong> ${escapeHtml(item.hora)}</div>
          <div><strong>Actividad:</strong> ${escapeHtml(item.nombre)}</div>
        </div>
      `;
    });
  }

  reporte.innerHTML = html;
  reporte.style.display = "block";
  reporte.scrollIntoView({behavior:"smooth"});
}

function formatearFechaInput(fecha){
  const partes = fecha.split("-");
  return `${partes[2]}/${partes[1]}/${partes[0]}`;
}

function escapeHtml(text){
  return String(text || "")
    .replaceAll("&","&amp;")
    .replaceAll("<","&lt;")
    .replaceAll(">","&gt;")
    .replaceAll('"',"&quot;");
}

generarCalendario();
</script>

</body>
</html>
