<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Calendario mensual de actividades</title>
<meta name="viewport" content="width=device-width, initial-scale=1">

<style>
*{box-sizing:border-box}

body{
  margin:0;
  font-family:'Segoe UI',sans-serif;
  background:linear-gradient(to bottom right,#cceeff,#99ccff);
  padding:14px;
  color:#003b57;
}

.wrap{
  max-width:1300px;
  margin:0 auto;
  background:#fff;
  border-radius:18px;
  box-shadow:0 0 12px rgba(0,0,0,.12);
  overflow:hidden;
}

.top{
  padding:14px 16px;
  border-bottom:3px solid #0099cc;
}

.title{
  font-size:22px;
  font-weight:800;
  color:#004466;
  margin-bottom:12px;
}

.controls{
  display:flex;
  gap:8px;
  align-items:center;
  flex-wrap:wrap;
}

select,input{
  padding:8px;
  border-radius:8px;
  border:1px solid #9ed8ef;
  font-size:14px;
}

.btn{
  border:none;
  background:#0099cc;
  color:white;
  padding:8px 11px;
  border-radius:9px;
  cursor:pointer;
  font-weight:700;
}

.btn:hover{background:#007faa}

.btn-green{background:#00a86b}
.btn-green:hover{background:#008e5b}

.btn-small{
  border:none;
  background:#00a86b;
  color:white;
  padding:7px 12px;
  border-radius:8px;
  cursor:pointer;
  font-size:13px;
  font-weight:700;
}

.btn-delete{
  border:none;
  background:#d9534f;
  color:white;
  padding:7px 10px;
  border-radius:7px;
  cursor:pointer;
  font-size:13px;
  font-weight:800;
}

.aviso{
  padding:10px 16px;
  font-size:13px;
  background:#f1fbff;
  border-bottom:1px solid #cdefff;
}

.table-wrap{
  display:none;
  overflow-x:auto;
}

table{
  width:100%;
  border-collapse:collapse;
  min-width:900px;
}

th{
  background:#e9f7ff;
  padding:12px;
  border-bottom:2px solid #bfe7ff;
  font-weight:800;
  color:#003d5a;
  font-size:16px;
}

td{
  border-bottom:1px solid #e6f2fa;
  padding:10px;
  vertical-align:top;
}

.col-fecha{
  width:170px;
  font-weight:800;
  text-align:left;
  background:#fbfdff;
  white-space:nowrap;
  font-size:16px;
}

.fecha-con-logo{
  display:flex;
  align-items:center;
  gap:8px;
}

.logo-dia{
  width:26px;
  height:26px;
  object-fit:contain;
}

.fila-hoy{
  background:#fffbea;
  outline:4px solid #e6c800;
  outline-offset:-4px;
}

.caja-eventos{
  background:#f8fcff;
  border:1px solid #d7edf8;
  border-radius:14px;
  padding:10px;
}

.evento{
  display:grid;
  grid-template-columns:190px 110px 1fr auto;
  gap:8px;
  margin-bottom:8px;
  align-items:center;
}

.evento input,
.evento select{
  width:100%;
  padding:8px;
  font-size:14px;
}

.sin-eventos{
  font-size:13px;
  color:#6b8794;
  text-align:center;
  margin:10px 0;
}

.acciones{
  text-align:center;
  margin-top:8px;
}

.oculto{
  display:none;
}

.vista-grafica{
  display:block;
  padding:16px;
}

.grid-calendario{
  display:grid;
  grid-template-columns:repeat(auto-fill,minmax(230px,1fr));
  gap:12px;
}

.dia-card{
  border:2px solid #d7edf8;
  border-radius:14px;
  background:#f8fcff;
  padding:10px;
  min-height:130px;
}

.dia-card.hoy-card{
  border-color:#e6c800;
  background:#fffbea;
}

.dia-numero{
  font-size:18px;
  font-weight:900;
  color:#004466;
  margin-bottom:8px;
  display:flex;
  align-items:center;
  gap:8px;
}

.evento-card{
  background:white;
  border-left:5px solid #0099cc;
  border-radius:8px;
  padding:8px;
  margin-bottom:8px;
  box-shadow:0 1px 4px rgba(0,0,0,.08);
}

.evento-turno{
  font-size:13px;
  font-weight:900;
  color:#004466;
}

.evento-hora-grande{
  font-size:18px;
  font-weight:900;
  color:#007faa;
  margin:3px 0;
}

.evento-nombre{
  font-size:14px;
  font-weight:700;
}

.sin-actividad-card{
  color:#7b929c;
  font-size:13px;
  text-align:center;
  margin-top:25px;
}

@media(max-width:700px){

  body{padding:6px}

  .wrap{border-radius:12px}

  .top{padding:12px}

  .title{
    font-size:20px;
    text-align:center;
  }

  .controls{
    flex-direction:column;
    align-items:stretch;
  }

  .controls label{
    font-weight:700;
  }

  .controls select,
  .controls input,
  .btn{
    width:100%;
    font-size:16px;
    padding:12px;
  }

  .aviso{
    font-size:14px;
    text-align:center;
  }

  .grid-calendario{
    grid-template-columns:1fr;
  }

  .dia-card{
    min-height:auto;
  }

  .dia-numero{
    font-size:24px;
  }

  .logo-dia{
    width:30px;
    height:30px;
  }

  .evento-card{
    padding:12px;
  }

  .evento-turno{
    font-size:16px;
  }

  .evento-hora-grande{
    font-size:24px;
  }

  .evento-nombre{
    font-size:18px;
  }

  table{
    min-width:0;
  }

  tr,td,th{
    display:block;
    width:100%;
  }

  th{
    display:none;
  }

  .col-fecha{
    width:100%;
    font-size:22px;
    background:#e9f7ff;
  }

  .evento{
    display:flex;
    flex-direction:column;
    gap:8px;
  }

  .evento select,
  .evento input,
  .btn-delete,
  .btn-small{
    width:100%;
    font-size:16px;
    padding:12px;
  }
}
</style>
</head>

<body>

<div class="wrap">

  <div class="top">
    <div class="title">Calendario mensual de actividades</div>

    <div class="controls">
      <label>Mes:</label>
      <select id="mes" onchange="cambioMesAnio()"></select>

      <label>Año:</label>
      <input type="number" id="anio" min="2020" max="2100" onchange="cambioMesAnio()">

      <button class="btn btn-green" onclick="alternarCarga()" id="btnCarga">Cargar actividades</button>

      <button class="btn" onclick="alternarAnteriores()" id="btnAnteriores">Ver días anteriores</button>

      <input type="text" id="buscador" placeholder="Buscar evento..." oninput="buscarEventos()">
    </div>
  </div>

  <div class="aviso">
    El calendario guarda automáticamente en línea. Los cambios se ven desde todas las computadoras.
  </div>

  <div class="vista-grafica" id="vistaGrafica">
    <div class="grid-calendario" id="gridCalendario"></div>
  </div>

  <div class="table-wrap" id="vistaTabla">
    <table id="tabla"></table>
  </div>

</div>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>

<script>
const firebaseConfig = {
  apiKey: "AIzaSyAUbSmA64Kj6326H8-FJqSFDyb1Zzardj8",
  authDomain: "calendario-actividades-76382.firebaseapp.com",
  databaseURL: "https://calendario-actividades-76382-default-rtdb.firebaseio.com",
  projectId: "calendario-actividades-76382",
  storageBucket: "calendario-actividades-76382.firebasestorage.app",
  messagingSenderId: "455833092742",
  appId: "1:455833092742:web:eafb4950d8de8409b80707",
  measurementId: "G-YWQ92KPD0T"
};

firebase.initializeApp(firebaseConfig);
const database = firebase.database();

const nombresMes = [
  "Enero","Febrero","Marzo","Abril","Mayo","Junio",
  "Julio","Agosto","Setiembre","Octubre","Noviembre","Diciembre"
];

const turnos = ["Matutino", "Vespertino", "Nocturno"];

const rangosTurnos = {
  "Matutino": "07 a 14",
  "Vespertino": "12 a 20",
  "Nocturno": "18 a 23"
};

const ordenTurnos = {
  "Matutino": 1,
  "Vespertino": 2,
  "Nocturno": 3
};

const mesSelect = document.getElementById("mes");
const anioInput = document.getElementById("anio");
const tabla = document.getElementById("tabla");
const btnAnteriores = document.getElementById("btnAnteriores");
const btnCarga = document.getElementById("btnCarga");
const buscador = document.getElementById("buscador");
const vistaTabla = document.getElementById("vistaTabla");
const vistaGrafica = document.getElementById("vistaGrafica");
const gridCalendario = document.getElementById("gridCalendario");

let mostrarAnteriores = false;
let modoCarga = false;
let datosFirebase = {};
let escribiendo = false;
let timersGuardado = {};

const hoy = new Date();
const hoyDia = hoy.getDate();
const hoyMes = hoy.getMonth();
const hoyAnio = hoy.getFullYear();

for(let i=0;i<12;i++){
  const op = document.createElement("option");
  op.value = i;
  op.textContent = nombresMes[i];
  mesSelect.appendChild(op);
}

mesSelect.value = hoyMes;
anioInput.value = hoyAnio;

function mostrarFecha(dia, mes, anio){
  return `
    <span class="fecha-con-logo">
      <img src="dia.png" class="logo-dia" alt="Día">
      <span>${dia}/${mes + 1}/${anio}</span>
    </span>
  `;
}

function textoTurno(turno){
  return `${turno} (${rangosTurnos[turno]})`;
}

function keyDia(anio, mes, dia, turno){
  return `calendario_${anio}_${mes + 1}_${dia}_${turno}`;
}

function obtenerEventos(key){
  return datosFirebase[key] || [];
}

function ordenarEventos(a,b){
  const turnoA = ordenTurnos[a.turno] || 99;
  const turnoB = ordenTurnos[b.turno] || 99;

  if(turnoA !== turnoB){
    return turnoA - turnoB;
  }

  const horaA = a.hora || "99:99";
  const horaB = b.hora || "99:99";

  return horaA.localeCompare(horaB);
}

function guardarEventos(key, eventos){
  datosFirebase[key] = eventos;

  clearTimeout(timersGuardado[key]);

  timersGuardado[key] = setTimeout(() => {
    database.ref("actividades/" + key).set(eventos);
  }, 500);
}

database.ref("actividades").on("value", function(snapshot){
  if(escribiendo){
    return;
  }

  datosFirebase = snapshot.val() || {};
  generarCalendario();
});

function cambioMesAnio(){
  generarCalendario();
}

function generarCalendario(){
  const mes = parseInt(mesSelect.value);
  const anio = parseInt(anioInput.value);
  const totalDias = new Date(anio, mes + 1, 0).getDate();

  let html = `
    <tr>
      <th class="col-fecha">Fecha</th>
      <th>Actividades</th>
    </tr>
  `;

  for(let dia=1; dia<=totalDias; dia++){
    const esMesActual = anio === hoyAnio && mes === hoyMes;
    const esDiaPasado = esMesActual && dia < hoyDia;
    const esHoy = esMesActual && dia === hoyDia;

    if(esDiaPasado && !mostrarAnteriores){
      continue;
    }

    let eventosDia = [];

    turnos.forEach(turno => {
      const key = keyDia(anio, mes, dia, turno);
      const eventos = obtenerEventos(key);

      eventos.forEach((ev, index) => {
        eventosDia.push({
          key:key,
          index:index,
          turno:turno,
          hora:ev.hora || "",
          nombre:ev.nombre || ""
        });
      });
    });

    eventosDia.sort(ordenarEventos);

    html += `
      <tr id="${esHoy ? "filaHoy" : ""}" class="${esHoy ? "fila-hoy" : ""}" data-dia="${dia}">
        <td class="col-fecha">${mostrarFecha(dia, mes, anio)}</td>
        <td>
          <div class="caja-eventos">
    `;

    if(eventosDia.length === 0){
      html += `<div class="sin-eventos">Sin eventos</div>`;
    }

    eventosDia.forEach(ev => {
      html += crearEventoHTML(anio, mes, dia, ev.key, ev.index, ev.turno, ev.hora, ev.nombre);
    });

    html += `
            <div class="acciones">
              <button class="btn-small" onclick="agregarEvento(${anio}, ${mes}, ${dia})">Agregar evento</button>
            </div>
          </div>
        </td>
      </tr>
    `;
  }

  tabla.innerHTML = html;
  generarVistaGrafica();
  buscarEventos();
}

function crearEventoHTML(anio, mes, dia, key, index, turno, hora = "", nombre = ""){
  return `
    <div class="evento">
      <select onchange="moverTurno('${key}', ${index}, ${anio}, ${mes}, ${dia}, this.value)">
        ${turnos.map(t => `
          <option value="${t}" ${t === turno ? "selected" : ""}>${textoTurno(t)}</option>
        `).join("")}
      </select>

      <input 
        type="time" 
        value="${escapeHtml(hora)}" 
        onfocus="escribiendo=true"
        onblur="escribiendo=false"
        oninput="actualizarEvento('${key}', ${index}, 'hora', this.value)"
      >

      <input 
        type="text" 
        value="${escapeHtml(nombre)}" 
        placeholder="Nombre del evento" 
        onfocus="escribiendo=true"
        onblur="escribiendo=false"
        oninput="actualizarEvento('${key}', ${index}, 'nombre', this.value)"
      >

      <button class="btn-delete" onclick="eliminarEvento('${key}', ${index})">X</button>
    </div>
  `;
}

function agregarEvento(anio, mes, dia){
  const key = keyDia(anio, mes, dia, "Matutino");
  const eventos = obtenerEventos(key);

  eventos.push({hora:"", nombre:""});
  datosFirebase[key] = eventos;

  database.ref("actividades/" + key).set(eventos).then(() => {
    generarCalendario();
  });
}

function actualizarEvento(key, index, campo, valor){
  escribiendo = true;

  const eventos = obtenerEventos(key);

  if(!eventos[index]){
    eventos[index] = {hora:"", nombre:""};
  }

  eventos[index][campo] = valor;
  guardarEventos(key, eventos);
  generarVistaGrafica();

  clearTimeout(window.timerEscribiendo);
  window.timerEscribiendo = setTimeout(() => {
    escribiendo = false;
  }, 900);
}

function moverTurno(keyVieja, index, anio, mes, dia, turnoNuevo){
  const eventosViejos = obtenerEventos(keyVieja);

  if(!eventosViejos[index]){
    return;
  }

  const evento = eventosViejos[index];
  eventosViejos.splice(index, 1);

  const keyNueva = keyDia(anio, mes, dia, turnoNuevo);
  const eventosNuevos = obtenerEventos(keyNueva);
  eventosNuevos.push(evento);

  datosFirebase[keyVieja] = eventosViejos;
  datosFirebase[keyNueva] = eventosNuevos;

  Promise.all([
    database.ref("actividades/" + keyVieja).set(eventosViejos),
    database.ref("actividades/" + keyNueva).set(eventosNuevos)
  ]).then(() => {
    generarCalendario();
  });
}

function eliminarEvento(key, index){
  const eventos = obtenerEventos(key);
  eventos.splice(index, 1);
  datosFirebase[key] = eventos;

  database.ref("actividades/" + key).set(eventos).then(() => {
    generarCalendario();
  });
}

function alternarAnteriores(){
  mostrarAnteriores = !mostrarAnteriores;
  btnAnteriores.textContent = mostrarAnteriores ? "Ocultar días anteriores" : "Ver días anteriores";
  generarCalendario();
}

function alternarCarga(){
  modoCarga = !modoCarga;

  if(modoCarga){
    vistaGrafica.style.display = "none";
    vistaTabla.style.display = "block";
    btnCarga.textContent = "Ver calendario";
  }else{
    vistaTabla.style.display = "none";
    vistaGrafica.style.display = "block";
    btnCarga.textContent = "Cargar actividades";
  }

  generarCalendario();
}

function generarVistaGrafica(){
  const mes = parseInt(mesSelect.value);
  const anio = parseInt(anioInput.value);
  const totalDias = new Date(anio, mes + 1, 0).getDate();
  const textoBusqueda = buscador.value.toLowerCase().trim();

  let html = "";

  for(let dia=1; dia<=totalDias; dia++){
    const esMesActual = anio === hoyAnio && mes === hoyMes;
    const esDiaPasado = esMesActual && dia < hoyDia;
    const esHoy = esMesActual && dia === hoyDia;

    if(esDiaPasado && !mostrarAnteriores){
      continue;
    }

    let eventosDia = [];

    turnos.forEach(turno => {
      const key = keyDia(anio, mes, dia, turno);
      const eventos = obtenerEventos(key);

      eventos.forEach(ev => {
        if((ev.nombre || "").trim() !== "" || (ev.hora || "").trim() !== ""){
          eventosDia.push({
            turno: turno,
            hora: ev.hora || "",
            nombre: ev.nombre || ""
          });
        }
      });
    });

    eventosDia.sort(ordenarEventos);

    if(textoBusqueda !== ""){
      eventosDia = eventosDia.filter(ev =>
        ev.nombre.toLowerCase().includes(textoBusqueda) ||
        ev.hora.toLowerCase().includes(textoBusqueda) ||
        ev.turno.toLowerCase().includes(textoBusqueda)
      );

      if(eventosDia.length === 0){
        continue;
      }
    }

    html += `
      <div class="dia-card ${esHoy ? "hoy-card" : ""}">
        <div class="dia-numero">
          <img src="dia.png" class="logo-dia" alt="Día">
          <span>${dia}/${mes + 1}/${anio}</span>
        </div>
    `;

    if(eventosDia.length === 0){
      html += `<div class="sin-actividad-card">Sin actividades</div>`;
    }else{
      eventosDia.forEach(ev => {
        html += `
          <div class="evento-card">
            <div class="evento-turno">${escapeHtml(textoTurno(ev.turno))}</div>
            <div class="evento-hora-grande">${escapeHtml(ev.hora || "Sin hora")}</div>
            <div class="evento-nombre">${escapeHtml(ev.nombre || "Sin nombre")}</div>
          </div>
        `;
      });
    }

    html += `</div>`;
  }

  gridCalendario.innerHTML = html;
}

function buscarEventos(){
  const texto = buscador.value.toLowerCase().trim();
  const filas = tabla.querySelectorAll("tr[data-dia]");

  filas.forEach(fila => {
    if(texto === ""){
      fila.classList.remove("oculto");
      return;
    }

    const contenido = fila.innerText.toLowerCase();

    if(contenido.includes(texto)){
      fila.classList.remove("oculto");
    }else{
      fila.classList.add("oculto");
    }
  });

  generarVistaGrafica();
}

function escapeHtml(text){
  return String(text || "")
    .replaceAll("&","&amp;")
    .replaceAll("<","&lt;")
    .replaceAll(">","&gt;")
    .replaceAll('"',"&quot;");
}

generarCalendario();
</script>

</body>
</html>
