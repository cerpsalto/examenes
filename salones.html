<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Gestión de Horarios por Salón</title>
<meta name="viewport" content="width=device-width, initial-scale=1">

<style>
*{box-sizing:border-box}

body{
  margin:0;
  font-family:'Segoe UI',sans-serif;
  background:linear-gradient(to bottom right,#cceeff,#99ccff);
  padding:12px;
  color:#003b57;
}

.wrap{
  max-width:1400px;
  margin:0 auto;
  background:#fff;
  border-radius:18px;
  box-shadow:0 0 12px rgba(0,0,0,.12);
  overflow:hidden;
}

.top{
  padding:14px 16px;
  border-bottom:3px solid #0099cc;
}

.encabezado{
  display:flex;
  align-items:center;
  justify-content:center;
  gap:12px;
  margin-bottom:12px;
}

.title{
  font-size:22px;
  font-weight:800;
  color:#004466;
}

.controls{
  display:flex;
  gap:8px;
  align-items:center;
  flex-wrap:wrap;
  justify-content:center;
}

select,input{
  padding:8px;
  border-radius:8px;
  border:1px solid #9ed8ef;
  font-size:14px;
}

.btn{
  border:none;
  background:#0099cc;
  color:white;
  padding:8px 11px;
  border-radius:9px;
  cursor:pointer;
  font-weight:700;
}

.btn:hover{background:#007faa}

.btn-green{background:#00a86b}
.btn-green:hover{background:#008e5b}

.btn-red{background:#d9534f}
.btn-red:hover{background:#c9302c}

.btn-small{
  border:none;
  background:#00a86b;
  color:white;
  padding:4px 8px;
  border-radius:6px;
  cursor:pointer;
  font-size:12px;
  font-weight:900;
}

.btn-minus{
  border:none;
  background:#d9534f;
  color:white;
  padding:2px 6px;
  border-radius:4px;
  cursor:pointer;
  font-size:11px;
  font-weight:900;
}

.vista-grafica{
  padding:16px;
}

.grid-salones{
  display:grid;
  grid-template-columns:repeat(auto-fill,minmax(260px,1fr));
  gap:12px;
}

.salon-card{
  border:2px solid #d7edf8;
  border-radius:12px;
  background:#f8fcff;
  padding:10px;
  min-height:120px;
}

.salon-header{
  font-size:16px;
  font-weight:900;
  color:#004466;
  margin-bottom:8px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  border-bottom: 2px solid #e1f3fd;
  padding-bottom: 4px;
}

/* ESTILOS DE VISTA COMPACTA (POR DEFECTO) */
.evento-card-compacto{
  background:white;
  border-left:4px solid #0099cc;
  border-radius:6px;
  padding:4px 6px;
  margin-bottom:4px;
  box-shadow:0 1px 3px rgba(0,0,0,.06);
  font-size:11px;
  line-height:1.3;
}

.evento-header-compacto{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:4px;
}

.evento-hora-compacto{
  font-weight:800;
  color:#007faa;
  white-space:nowrap;
}

.evento-info-compacto{
  color:#003b57;
  overflow:hidden;
  text-overflow:ellipsis;
  white-space:nowrap;
}

/* ESTILOS DE VISTA DETALLADA (CUANDO SE FILTRA) */
.evento-card-detallado{
  background:white;
  border-left:5px solid #0099cc;
  border-radius:8px;
  padding:8px;
  margin-bottom:8px;
  box-shadow:0 1px 4px rgba(0,0,0,.08);
}

.evento-header-detallado{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:4px;
}

.evento-hora-detallado{
  font-size:13px;
  font-weight:900;
  color:#007faa;
}

.evento-detalle{
  font-size:12px;
  margin-top:2px;
}

.evento-detalle strong{
  color:#004466;
}

.acciones-evento{
  display:none;
  gap:6px;
  margin-top:6px;
}

.acciones-evento.activo{
  display:flex;
}

.acciones-evento button{
  flex:1;
}

.sin-actividad-card{
  color:#7b929c;
  font-size:12px;
  text-align:center;
  margin:15px 0;
}

.modal-fondo{
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.45);
  display:none;
  align-items:center;
  justify-content:center;
  padding:15px;
  z-index:1000;
}

.modal{
  background:white;
  border-radius:16px;
  padding:18px;
  width:100%;
  max-width:440px;
  box-shadow:0 0 18px rgba(0,0,0,.25);
  max-height: 90vh;
  overflow-y: auto;
}

.modal h2{
  margin-top:0;
  color:#004466;
  text-align:center;
}

.modal label{
  display:block;
  font-weight:800;
  margin-top:10px;
  font-size:14px;
}

.modal input,
.modal select{
  width:100%;
  padding:9px;
  font-size:15px;
  margin-top:4px;
}

.modal-actions{
  display:flex;
  gap:8px;
  margin-top:18px;
}

.modal-actions button{
  flex:1;
}

@media(max-width:700px){
  body{padding:6px}
  .controls{flex-direction:column; align-items:stretch;}
  .grid-salones{grid-template-columns:1fr;}
}
</style>
</head>

<body>

<div class="wrap">

  <div class="top">
    <div class="encabezado">
      <div class="title">Gestión de Horarios por Salón</div>
    </div>

    <div class="controls">
      <label>Día de la semana:</label>
      <select id="diaSemana" onchange="generarVistaSalones()">
        <option value="Lunes">Lunes</option>
        <option value="Martes">Martes</option>
        <option value="Miércoles">Miércoles</option>
        <option value="Jueves">Jueves</option>
        <option value="Viernes">Viernes</option>
        <option value="Sábado">Sábado</option>
      </select>

      <label>Buscar por:</label>
      <select id="tipoBusqueda" onchange="cambiarTipoBusqueda()">
        <option value="asignatura">Asignatura</option>
        <option value="docente">Docente</option>
        <option value="especialidad">Especialidad</option>
      </select>

      <select id="selectAnio" onchange="generarVistaSalones()" style="display:none;">
        <option value="">Todos los años</option>
        <option value="Primero">Primero</option>
        <option value="Segundo">Segundo</option>
        <option value="Tercero">Tercero</option>
        <option value="Cuarto">Cuarto</option>
      </select>

      <input type="text" id="buscador" placeholder="Buscar asignatura..." oninput="generarVistaSalones()" style="width: 250px;">
    </div>
  </div>

  <div class="vista-grafica">
    <div class="grid-salones" id="gridSalones"></div>
  </div>

</div>

<!-- MODAL PARA AGREGAR / EDITAR HORARIO DE SALÓN -->
<div class="modal-fondo" id="modalFondo">
  <div class="modal">
    <h2 id="tituloModal">Asignar Salón</h2>

    <label>Horario Inicio</label>
    <select id="modalHoraInicio"></select>

    <label>Horario Fin</label>
    <select id="modalHoraFin"></select>

    <label>Docente</label>
    <input type="text" id="modalDocente">

    <label>Asignatura</label>
    <input type="text" id="modalAsignatura">

    <label>Especialidad</label>
    <input type="text" id="modalEspecialidad">

    <label>Año</label>
    <select id="modalAnio">
      <option value="Primero">Primero</option>
      <option value="Segundo">Segundo</option>
      <option value="Tercero">Tercero</option>
      <option value="Cuarto">Cuarto</option>
    </select>

    <div class="modal-actions">
      <button class="btn btn-green" onclick="guardarDesdeModal()">Guardar</button>
      <button class="btn btn-red" onclick="cerrarModal()">Cancelar</button>
    </div>
  </div>
</div>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>

<script>
const firebaseConfig = {
  apiKey: "AIzaSyAUbSmA64Kj6326H8-FJqSFDyb1Zzardj8",
  authDomain: "calendario-actividades-76382.firebaseapp.com",
  databaseURL: "https://calendario-actividades-76382-default-rtdb.firebaseio.com",
  projectId: "calendario-actividades-76382",
  storageBucket: "calendario-actividades-76382.firebasestorage.app",
  messagingSenderId: "455833092742",
  appId: "1:455833092742:web:eafb4950d8de8409b80707",
  measurementId: "G-YWQ92KPD0T"
};

firebase.initializeApp(firebaseConfig);
const database = firebase.database();

const horasInicio = [
  "07:10", "07:55", "08:50", "09:35", "10:30", "11:15",
  "12:10", "12:55", "13:50", "14:35", "15:30", "16:15",
  "17:10", "17:55", "18:50", "19:35", "20:25", "21:10",
  "22:05", "22:50"
];

const horasFin = [
  "07:55", "08:40", "09:35", "10:20", "11:15", "12:00",
  "12:55", "13:40", "14:35", "15:20", "16:15", "17:00",
  "17:55", "18:40", "19:35", "20:20", "21:10", "21:55",
  "22:50", "23:35"
];

const salones = [];
for(let i=1; i<=24; i++){
  salones.push(`Salón ${i}`);
}
salones.push("Mediateca");

const diaSemanaSelect = document.getElementById("diaSemana");
const tipoBusquedaSelect = document.getElementById("tipoBusqueda");
const selectAnio = document.getElementById("selectAnio");
const gridSalones = document.getElementById("gridSalones");
const buscador = document.getElementById("buscador");

const modalFondo = document.getElementById("modalFondo");
const tituloModal = document.getElementById("tituloModal");
const modalHoraInicio = document.getElementById("modalHoraInicio");
const modalHoraFin = document.getElementById("modalHoraFin");
const modalDocente = document.getElementById("modalDocente");
const modalAsignatura = document.getElementById("modalAsignatura");
const modalEspecialidad = document.getElementById("modalEspecialidad");
const modalAnio = document.getElementById("modalAnio");

let datosFirebase = {};

let modalModo = "agregar";
let modalSalonSeleccionado = null;
let modalIndex = null;

horasInicio.forEach((h, index) => {
  const op = document.createElement("option");
  op.value = h;
  op.textContent = `${h} a ${horasFin[index]}`;
  modalHoraInicio.appendChild(op);
});

horasFin.forEach(h => {
  const op = document.createElement("option");
  op.value = h;
  op.textContent = h;
  modalHoraFin.appendChild(op);
});

function cambiarTipoBusqueda(){
  const tipo = tipoBusquedaSelect.value;
  if(tipo === "especialidad"){
    selectAnio.style.display = "inline-block";
    buscador.placeholder = "Buscar especialidad...";
  } else {
    selectAnio.style.display = "none";
    selectAnio.value = "";
    if(tipo === "docente"){
      buscador.placeholder = "Buscar docente...";
    } else {
      buscador.placeholder = "Buscar asignatura...";
    }
  }
  generarVistaSalones();
}

function keySalonDia(salon, dia){
  const salonClean = salon.replace(/\s+/g, '_');
  return `horarios_salones_${salonClean}_${dia}`;
}

function obtenerEventos(key){
  return datosFirebase[key] || [];
}

database.ref("gestion_salones").on("value", function(snapshot){
  datosFirebase = snapshot.val() || {};
  generarVistaSalones();
});

function generarVistaSalones(){
  const diaActual = diaSemanaSelect.value;
  const tipoBusqueda = tipoBusquedaSelect.value;
  const textoBusqueda = buscador.value.toLowerCase().trim();
  const anioFiltro = selectAnio.value;

  // Identificar si hay algún filtro activo
  const estaFiltrando = textoBusqueda !== "" || anioFiltro !== "";

  let html = "";

  salones.forEach(salon => {
    const key = keySalonDia(salon, diaActual);
    const eventos = obtenerEventos(key);

    eventos.sort((a, b) => (a.horaInicio || "").localeCompare(b.horaInicio || ""));

    let eventosFiltrados = eventos;

    if(tipoBusqueda === "especialidad" && anioFiltro !== ""){
      eventosFiltrados = eventosFiltrados.filter(ev => (ev.anio || "") === anioFiltro);
    }

    if(textoBusqueda !== ""){
      eventosFiltrados = eventosFiltrados.filter(ev => {
        if(tipoBusqueda === "docente"){
          return (ev.docente || "").toLowerCase().includes(textoBusqueda);
        } else if(tipoBusqueda === "especialidad"){
          return (ev.especialidad || "").toLowerCase().includes(textoBusqueda);
        } else {
          return (ev.asignatura || "").toLowerCase().includes(textoBusqueda);
        }
      });
    }

    if(estaFiltrando && eventosFiltrados.length === 0){
      return;
    }

    html += `
      <div class="salon-card">
        <div class="salon-header">
          <span>🏛️ ${salon}</span>
          <button class="btn-small" onclick="abrirAgregar('${salon}')">+</button>
        </div>
    `;

    if(eventosFiltrados.length === 0){
      html += `<div class="sin-actividad-card">Sin clases asignadas</div>`;
    }else{
      eventosFiltrados.forEach((ev, idx) => {
        const idAcciones = `acciones_${key.replace(/[^a-zA-Z0-9_]/g, '')}_${idx}`;

        if(!estaFiltrando){
          // VISTA COMPACTA (POR DEFECTO)
          html += `
            <div class="evento-card-compacto">
              <div class="evento-header-compacto">
                <span class="evento-hora-compacto">⏰ ${escapeHtml(ev.horaInicio)}-${escapeHtml(ev.horaFin)}</span>
                <span class="evento-info-compacto"><strong>${escapeHtml(ev.asignatura)}</strong> (${escapeHtml(ev.docente)})</span>
                <button class="btn-minus" onclick="mostrarAcciones('${idAcciones}')">-</button>
              </div>

              <div class="acciones-evento" id="${idAcciones}">
                <button class="btn" onclick="abrirEditar('${salon}', ${idx})">Editar</button>
                <button class="btn btn-red" onclick="eliminarEvento('${salon}', ${idx})">Quitar</button>
              </div>
            </div>
          `;
        } else {
          // VISTA DETALLADA EXTENDIDA (AL FILTRAR)
          html += `
            <div class="evento-card-detallado">
              <div class="evento-header-detallado">
                <span class="evento-hora-detallado">⏰ ${escapeHtml(ev.horaInicio)} a ${escapeHtml(ev.horaFin)}</span>
                <button class="btn-minus" onclick="mostrarAcciones('${idAcciones}')">-</button>
              </div>
              <div class="evento-detalle"><strong>Asignatura:</strong> ${escapeHtml(ev.asignatura)}</div>
              <div class="evento-detalle"><strong>Docente:</strong> ${escapeHtml(ev.docente)}</div>
              <div class="evento-detalle"><strong>Especialidad:</strong> ${escapeHtml(ev.especialidad)}</div>
              <div class="evento-detalle"><strong>Año:</strong> ${escapeHtml(ev.anio)}</div>

              <div class="acciones-evento" id="${idAcciones}">
                <button class="btn" onclick="abrirEditar('${salon}', ${idx})">Editar</button>
                <button class="btn btn-red" onclick="eliminarEvento('${salon}', ${idx})">Quitar</button>
              </div>
            </div>
          `;
        }
      });
    }

    html += `</div>`;
  });

  if(html === "" && estaFiltrando){
    html = `<div style="grid-column: 1/-1; text-align: center; color: #004466; font-size: 16px; padding: 20px;">No se encontraron salones ni cursos que coincidan con los filtros seleccionados.</div>`;
  }

  gridSalones.innerHTML = html;
}

function mostrarAcciones(id){
  const panel = document.getElementById(id);
  if(panel){
    panel.classList.toggle("activo");
  }
}

function abrirAgregar(salon){
  modalModo = "agregar";
  modalSalonSeleccionado = salon;
  modalIndex = null;

  tituloModal.textContent = `Asignar a ${salon}`;
  modalHoraInicio.selectedIndex = 0;
  modalHoraFin.selectedIndex = 0;
  modalDocente.value = "";
  modalAsignatura.value = "";
  modalEspecialidad.value = "";
  modalAnio.value = "Primero";

  modalFondo.style.display = "flex";
}

function abrirEditar(salon, index){
  const diaActual = diaSemanaSelect.value;
  const key = keySalonDia(salon, diaActual);
  const eventos = obtenerEventos(key);
  const ev = eventos[index];

  if(!ev) return;

  modalModo = "editar";
  modalSalonSeleccionado = salon;
  modalIndex = index;

  tituloModal.textContent = `Editar asignación en ${salon}`;
  modalHoraInicio.value = ev.horaInicio || horasInicio[0];
  modalHoraFin.value = ev.horaFin || horasFin[0];
  modalDocente.value = ev.docente || "";
  modalAsignatura.value = ev.asignatura || "";
  modalEspecialidad.value = ev.especialidad || "";
  modalAnio.value = ev.anio || "Primero";

  modalFondo.style.display = "flex";
}

function cerrarModal(){
  modalFondo.style.display = "none";
}

function guardarDesdeModal(){
  const diaActual = diaSemanaSelect.value;
  const horaInicio = modalHoraInicio.value;
  const horaFin = modalHoraFin.value;
  const docente = modalDocente.value.trim();
  const asignatura = modalAsignatura.value.trim();
  const especialidad = modalEspecialidad.value.trim();
  const anio = modalAnio.value;

  if(!docente || !asignatura){
    alert("Por favor complete los campos requeridos.");
    return;
  }

  if(horaInicio >= horaFin){
    alert("La hora de inicio debe ser anterior a la hora de fin.");
    return;
  }

  const key = keySalonDia(modalSalonSeleccionado, diaActual);
  const eventos = obtenerEventos(key);

  if(modalModo === "agregar"){
    eventos.push({ horaInicio, horaFin, docente, asignatura, especialidad, anio });
  } else if(modalModo === "editar" && modalIndex !== null){
    eventos[modalIndex] = { horaInicio, horaFin, docente, asignatura, especialidad, anio };
  }

  datosFirebase[key] = eventos;

  database.ref("gestion_salones/" + key).set(eventos).then(() => {
    cerrarModal();
    generarVistaSalones();
  });
}

function eliminarEvento(salon, index){
  if(!confirm("¿Quitar esta ocupación de horario?")){
    return;
  }

  const diaActual = diaSemanaSelect.value;
  const key = keySalonDia(salon, diaActual);
  const eventos = obtenerEventos(key);

  eventos.splice(index, 1);
  datosFirebase[key] = eventos;

  database.ref("gestion_salones/" + key).set(eventos).then(() => {
    generarVistaSalones();
  });
}

function escapeHtml(text){
  return String(text || "")
    .replaceAll("&","&amp;")
    .replaceAll("<","&lt;")
    .replaceAll(">","&gt;")
    .replaceAll('"',"&quot;");
}

generarVistaSalones();
</script>

</body>
</html>
